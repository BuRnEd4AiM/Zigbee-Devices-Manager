name: Demo bauen
on:
  push:
    paths: ["zigbee_devices_manager/web/**", "scripts/build_demo.py", ".github/workflows/demo.yml"]
  workflow_dispatch:
jobs:
  demo:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/build_demo.py
      - uses: actions/upload-artifact@v4
        with:
          name: zigbee-devices-manager-demo
          path: demo/zigbee-devices-manager-demo.html
      # Release-Assets werden von GitHub als Datei-Download ausgeliefert (nicht im Browser angezeigt)
      - name: Release "demo" aktualisieren
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete demo --cleanup-tag --yes || true
          gh release create demo demo/zigbee-devices-manager-demo.html \
            --title "Demo" --notes "Eigenständige Demo – herunterladen und im Browser öffnen." \
            --target "$GITHUB_SHA"
