name: Tests
on:
  push:
  pull_request:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Parser und Baum-Algorithmus des Reiters „Netzwerk“ (ohne npm-Abhängigkeiten)
      - run: node --test test/zigbee-tree.test.mjs
      - run: python3 -m py_compile zigbee_devices_manager/server.py
