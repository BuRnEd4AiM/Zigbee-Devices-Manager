<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee Devices Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e2e5ec;--accent:#0b7bd6;--accent-fg:#fff;--ok:#1a8f4c;--warn:#b86e00;--new:#c2410c;--chip:#eef2f8;--input:#fff}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2028;--fg:#e6e9ef;--muted:#8d95a8;--line:#2d3340;--accent:#4aa3f0;--accent-fg:#06131f;--ok:#4cc27e;--warn:#e0a040;--new:#f08a4b;--chip:#262c38;--input:#14171d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--fg);font-weight:600}
main{padding:16px;width:100%}
.banner{background:var(--chip);border:1px solid var(--line);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,button{font:inherit;color:var(--fg)}
input,select{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
button.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:4px}
.chips button{background:var(--chip);border:0;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tr:last-child td{border-bottom:0}
td.name{cursor:text;font-weight:600;min-width:150px;word-break:break-word}
#tab-devices table{table-layout:auto;width:100%}
#tab-devices td select{width:100%;min-width:125px;max-width:100%}
#tab-devices td code{word-break:break-all}
.card{overflow-x:auto}
td.name:hover{text-decoration:underline dotted}
td.name input{width:100%;font-weight:600}
.sub{color:var(--muted);font-size:12px;font-weight:400}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge.new{background:color-mix(in srgb,var(--new) 18%,transparent);color:var(--new)}
.badge.ok{color:var(--ok)}.badge.plan{color:var(--accent)}
.sugg{color:var(--ok);font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{padding:32px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{min-width:110px;color:var(--muted)}
.list .row input:first-child{flex:1}.list .row input.abbr{width:80px;flex:none;font-family:ui-monospace,monospace}
.preview{background:var(--chip);border-radius:6px;padding:10px;font-family:ui-monospace,monospace;line-height:1.8}
.tok{cursor:pointer;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:ui-monospace,monospace;font-size:12px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:1250px){.hide-m{display:none}}
@media(max-width:1050px){.hide-l{display:none}}
@media(max-width:700px){.hide-s{display:none}}
</style>
</head>
<body>
<header>
  <h1>🐝 Zigbee Devices Manager</h1>
  <nav>
    <button data-tab="devices" class="on">Geräte</button>
    <button data-tab="gateways">Gateways</button>
    <button data-tab="scheme">Namensschema</button>
    <button data-tab="export">Export</button>
  </nav>
</header>
<main>
  <div id="banner"></div>
  <section id="tab-devices"></section>
  <section id="tab-gateways" hidden></section>
  <section id="tab-scheme" hidden></section>
  <section id="tab-export" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script>window.ZDM_DEMO = true;</script>
<script>
// ---------- Konfiguration / Standarddaten ----------
const DEMO_FORCED = window.ZDM_DEMO === true;

const DEFAULT_SCHEME = {
  pattern: "{room}_{type}_{nr}",
  case: "upper",
  counter: {style: "arabic", pad: 2, start: 1},
  houses: [{id: "h1", name: "Haus 1", abbr: "H1"}, {id: "h2", name: "Haus 2", abbr: "H2"}],
  defaultHouse: "h1",
  floors: [{id: "f0", name: "Erdgeschoss", abbr: "H0"}, {id: "f1", name: "1. Etage", abbr: "H1"}, {id: "f2", name: "2. Etage", abbr: "H2"}, {id: "f3", name: "3. Etage", abbr: "H3"}],
  rooms: [
    {id: "r1", name: "Wohnzimmer", abbr: "WZ"}, {id: "r2", name: "Küche", abbr: "KU"},
    {id: "r3", name: "Schlafzimmer", abbr: "SZ"}, {id: "r4", name: "Bad", abbr: "BD"},
    {id: "r5", name: "Flur", abbr: "FL"}, {id: "r6", name: "Büro", abbr: "BU"},
    {id: "r7", name: "Garten", abbr: "GA"}
  ],
  types: [
    {id: "t1", name: "Lampe", abbr: "LP"}, {id: "t2", name: "Steckdose", abbr: "ST"},
    {id: "t3", name: "Temperatursensor", abbr: "TS"}, {id: "t4", name: "Bewegungsmelder", abbr: "BM"},
    {id: "t5", name: "Fenster-/Türkontakt", abbr: "FK"}, {id: "t6", name: "Taster", abbr: "TA"},
    {id: "t7", name: "Rollo", abbr: "RO"}, {id: "t8", name: "Heizkörperthermostat", abbr: "HT"}
  ]
};

const DEMO_FLOORS = [{id: "fl_eg", name: "Erdgeschoss", level: 0}, {id: "fl_og", name: "Obergeschoss", level: 1}, {id: "fl_ug", name: "Untergeschoss", level: -1}];
const DEMO_AREAS = [["Wohnzimmer", "fl_eg"], ["Küche", "fl_eg"], ["Flur", "fl_eg"], ["Schlafzimmer", "fl_og"], ["Bad", "fl_og"], ["Büro", "fl_og"], ["Terrasse", "fl_eg"], ["Keller", "fl_ug"]].map(([n, f]) => ({id: "area_" + n.toLowerCase().replace("ü", "ue"), name: n, floor_id: f}));
const DEMO_BRIDGES = [{id: "b1", source: "z2m", name: "Zigbee2MQTT Bridge (Haus 1)"}, {id: "b2", source: "z2m", name: "Zigbee2MQTT Bridge (Haus 2)"}];
const DEMO_DEVICES = [
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0001", "Wohnzimmer", "Wohnzimmer Stehlampe"],
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0002", "Wohnzimmer", null],
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0003", "Wohnzimmer", null],
  ["Hue white ambiance", "Signify Netherlands B.V.", "LTW013", "0x001788010a1b2c03", "Küche", null],
  ["lumi.weather", "LUMI", "WSDCGQ11LM", "0x00158d0001a2b3c4", "Schlafzimmer", null],
  ["lumi.weather", "LUMI", "WSDCGQ11LM", "0x00158d0001a2b3c5", "", null],
  ["lumi.sensor_motion.aq2", "LUMI", "RTCGQ11LM", "0x00158d0002c4d5e6", "Flur", null],
  ["lumi.sensor_magnet.aq2", "LUMI", "MCCGQ11LM", "0x00158d0003d5e6f7", "Bad", null],
  ["lumi.sensor_magnet.aq2", "LUMI", "MCCGQ11LM", "0x00158d0003d5e6f8", "", null],
  ["TS011F", "_TZ3000_g5xawfcq", "TS011F_plug_1", "0xa4c138aabbcc0001", "Büro", "Büro Steckdose Monitor"],
  ["TS011F", "_TZ3000_g5xawfcq", "TS011F_plug_1", "0xa4c138aabbcc0002", "", null],
  ["TRV001", "Eurotronic", "SPZB0001", "0x00124b0022ee0001", "Büro", null],
  ["TRADFRI remote control", "IKEA of Sweden", "E1524", "0x680ae2fffe1a0010", "Wohnzimmer", null],
  ["Zigbee Coordinator", "Texas Instruments", "CC2652P", "0x00124b0030aa0000", "", "Koordinator"]
].map((d, i) => ({id: "demo" + i, source: "z2m", bridge: i < 8 ? "b1" : "b2", orig_name: d[0], manufacturer: d[1], model: d[2], ieee: d[3], area: d[4],
  is_new: !d[5], name: d[5] || d[3], area_id: d[4] ? "area_" + d[4].toLowerCase().replace("ü", "ue") : ""}));

// ---------- Hilfsfunktionen ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Namens-Generator ----------
function toRoman(n) {
  const m = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let r = ""; for (const [v, s] of m) while (n >= v) { r += s; n -= v; } return r;
}
function toAlpha(n) { let r = ""; while (n > 0) { n--; r = String.fromCharCode(65 + n % 26) + r; n = Math.floor(n / 26); } return r; }
function fmtNr(n, c) {
  if (c.style === "roman") return toRoman(n);
  if (c.style === "alpha") return toAlpha(n);
  return String(n).padStart(c.pad, "0");
}
function applyCase(s, mode) { return mode === "upper" ? s.toUpperCase() : mode === "lower" ? s.toLowerCase() : s; }
function buildName(scheme, room, type, n, house, floor) {
  const s = scheme.pattern
    .replaceAll("{house}", house?.abbr ?? "").replaceAll("{floor}", floor?.abbr ?? "").replaceAll("{room}", room?.abbr ?? "").replaceAll("{type}", type?.abbr ?? "")
    .replaceAll("{nr}", fmtNr(n, scheme.counter));
  return applyCase(s, scheme.case);
}
/** Nächste freie Nummer für Haus+Raum+Typ, berücksichtigt bereits belegte Namen. */
function nextName(scheme, room, type, used, house, floor) {
  for (let n = scheme.counter.start; n < 10000; n++) {
    const name = buildName(scheme, room, type, n, house, floor);
    if (!used.has(name.toLowerCase())) return name;
  }
}

// ---------- API (Add-on oder Demo) ----------
const api = {
  demo: DEMO_FORCED,
  async load() {
    if (!this.demo) {
      let r;
      try { r = await fetch("api/state"); }
      catch (e) { this.demo = true; }            // z. B. Datei lokal geöffnet: Demo
      if (r && r.status === 404) this.demo = true; // statischer Host ohne Add-on-Server: Demo
      else if (r) {
        if (!r.ok) { this.error = `HTTP ${r.status}: ${(await r.text()).slice(0, 400)}`; return {devices: [], store: {}, bridges: []}; }
        try { return await r.json(); } catch (e) { this.error = "Unerwartete Antwort vom Add-on-Server: " + e.message; return {devices: [], store: {}, bridges: []}; }
      }
    }
    let store = {};
    try { store = JSON.parse(localStorage.getItem("zdm-demo-store") || "{}"); } catch (e) {}
    let devices = clone(DEMO_DEVICES);
    try { const n = JSON.parse(localStorage.getItem("zdm-demo-names") || "{}"); devices.forEach(d => { if (n[d.id]) { d.name = n[d.id]; d.is_new = false; } }); } catch (e) {}
    return {devices, store, bridges: DEMO_BRIDGES, areas: DEMO_AREAS, floors: DEMO_FLOORS};
  },
  async saveStore(store) {
    if (this.demo) { try { localStorage.setItem("zdm-demo-store", JSON.stringify(store)); } catch (e) {} return; }
    const r = await fetch("api/store", {method: "PUT", body: JSON.stringify(store)});
    if (!r.ok) throw new Error(await r.text());
  },
  payload(list) {
    return list.map(([d, name]) => ({device_id: d.id, name, old_name: d.name, orig_name: d.orig_name, source: d.source, ieee: d.ieee, base_topic: gwOf(d).topic || "zigbee2mqtt"}));
  },
  opts() { const on = S.renameEntities; return {rename_entities: on, update_references: on && S.updateRefs, update_yaml: on && S.updateYaml, update_nodered: on && S.updateNodered}; },
  async post(path, body) {
    const r = await fetch(path, {method: "POST", body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async plan(list) {
    if (this.demo) {
      const slug = t => t.toLowerCase().replace(/ä/g, "a").replace(/ö/g, "o").replace(/ü/g, "u").replace(/ß/g, "ss").replace(/[^a-z0-9]+/g, "_").replace(/^_|_$/g, "");
      const entities = list.flatMap(([d, name]) => [["light", ""], ["sensor", "_battery"]].map(([dom, suf]) => ({old: `${dom}.${slug(d.name)}${suf}`, new: `${dom}.${slug(name)}${suf}`})));
      const o = this.opts(), usages = [];
      if (o.update_references) usages.push({kind: "automation", title: "Beispiel: Licht abends an", entities: [entities[0].old]}, {kind: "dashboard", title: "Übersicht", entities: entities.map(e => e.old)});
      if (o.update_yaml) usages.push({kind: "yaml", title: "packages/licht.yaml", entities: [entities[0].old]});
      if (o.update_nodered) usages.push({kind: "nodered", title: "a0d7b954_nodered/flows.json", entities: entities.map(e => e.old)});
      return {entities, skipped: [], usages, unreadable: 0, notes: []};
    }
    return this.post("api/plan", {items: this.payload(list), ...this.opts()});
  },
  async apply(list) {
    if (this.demo) {
      try { const n = JSON.parse(localStorage.getItem("zdm-demo-names") || "{}"); list.forEach(([d, name]) => n[d.id] = name); localStorage.setItem("zdm-demo-names", JSON.stringify(n)); } catch (e) {}
      const res = {ok: true, errors: [], renamed_entities: [], updated_references: []};
      res.checks = this.demoChecks({items: list, opts: this.opts()});
      return res;
    }
    return this.post("api/apply", {items: this.payload(list), ...this.opts()});
  },
  async permit(b, seconds) {
    if (this.demo) return;
    await this.post("api/permit_join", {source: b.source, base_topic: S.gateways[b.id]?.topic || "zigbee2mqtt", time: seconds});
  },
  async permitState() {
    if (this.demo) return {};
    const r = await fetch("api/permit_state"); return r.ok ? r.json() : {};
  },
  async verify(last) {
    if (this.demo) return {checks: this.demoChecks(last)};
    return this.post("api/verify", {items: last.items, renamed: last.renamed, ...last.opts});
  },
  demoChecks(last) {
    const o = last.opts, c = [{name: "Gerätenamen", status: "ok", detail: last.items.length + " Gerät(e) heißen jetzt wie geplant"}];
    if (o.rename_entities) c.push({name: "Entity-IDs", status: "ok", detail: "Beispiel: alte IDs gibt es nicht mehr"});
    if (o.update_references || o.update_yaml || o.update_nodered) c.push({name: "Verweise", status: "ok", detail: "Beispiel: keine alten Entity-IDs mehr gefunden"});
    if (o.update_nodered) c.push({name: "Node-RED", status: "info", detail: "Node-RED jetzt neu starten"});
    return c;
  }
};

// ---------- State ----------
const S = {devices: [], scheme: clone(DEFAULT_SCHEME), meta: {}, planned: [], filter: "all", q: "", sel: new Set(), areas: [], haFloors: [], bridges: [], gateways: {}, gwFilter: "", permitUntil: {}, permitReal: {}, editing: null, renameEntities: false, updateRefs: true, updateYaml: false, updateNodered: false};

function persist() {
  clearTimeout(persist.t);
  persist.t = setTimeout(() => api.saveStore({scheme: S.scheme, meta: S.meta, planned: S.planned, gateways: S.gateways}).catch(e => toast("Speichern fehlgeschlagen: " + e.message)), 300);
}
const allRows = () => [...S.devices, ...S.planned.map(p => ({id: p.id, name: p.name, orig_name: "", manufacturer: "", model: "", ieee: "", area: "", is_new: false, planned: true}))];
const roomOf = d => { const id = S.meta[d.id]?.room; return S.scheme.rooms.find(r => r.id === id) || S.scheme.rooms.find(r => d.area_id && r.area_id === d.area_id) || S.scheme.rooms.find(r => d.area && r.name.toLowerCase() === d.area.toLowerCase()); };

/** Kürzel für einen neuen Raum: erste Buchstaben des Namens, eindeutig unter den vorhandenen Räumen. */
function makeAbbr(name, rooms) {
  const letters = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]/g, "");
  const taken = new Set(rooms.map(r => r.abbr.toLowerCase()));
  for (let n = 2; n <= letters.length; n++) { const a = letters.slice(0, n).toUpperCase(); if (!taken.has(a.toLowerCase())) return a; }
  let i = 2; while (taken.has((letters.slice(0, 2) + i).toLowerCase())) i++;
  return letters.slice(0, 2).toUpperCase() + i;
}
/** Übernimmt Etagen aus Home Assistant (Kürzel: H<Ebene>, negative Ebenen U<n>). Verknüpft gleichnamige vorhandene Etagen. */
function syncFloors() {
  const sc = S.scheme; sc.ignoredFloors = sc.ignoredFloors || []; let changed = false;
  for (const f of S.haFloors) {
    if (sc.floors.some(x => x.floor_id === f.id) || sc.ignoredFloors.includes(f.id)) continue;
    const same = sc.floors.find(x => !x.floor_id && x.name.toLowerCase() === f.name.toLowerCase());
    if (same) { same.floor_id = f.id; changed = true; continue; }
    const lvl = Number.isInteger(f.level) ? f.level : null;
    let abbr = lvl === null ? makeAbbr(f.name, sc.floors) : lvl >= 0 ? "H" + lvl : "U" + -lvl;
    const byAbbr = sc.floors.find(x => !x.floor_id && x.abbr.toLowerCase() === abbr.toLowerCase()); // z. B. Ebene 1 ↔ vorhandenes H1
    if (byAbbr) { byAbbr.floor_id = f.id; changed = true; continue; }
    while (sc.floors.some(x => x.abbr.toLowerCase() === abbr.toLowerCase())) abbr += "x";
    sc.floors.push({id: uid("f"), name: f.name, abbr, floor_id: f.id}); changed = true;
  }
  if (changed) persist();
}
/** Übernimmt Bereiche aus Home Assistant als Räume (verknüpft vorhandene gleichnamige, legt fehlende an). Gibt die Zahl neuer Räume zurück. */
function syncAreas() {
  const sc = S.scheme; sc.ignoredAreas = sc.ignoredAreas || []; let added = 0, changed = false;
  for (const a of S.areas) {
    if (sc.rooms.some(r => r.area_id === a.id) || sc.ignoredAreas.includes(a.id)) continue;
    const same = sc.rooms.find(r => !r.area_id && r.name.toLowerCase() === a.name.toLowerCase());
    if (same) { same.area_id = a.id; changed = true; continue; }
    sc.rooms.push({id: uid("r"), name: a.name, abbr: makeAbbr(a.name, sc.rooms), area_id: a.id}); added++;
  }
  if (added || changed) persist();
  return added;
}
const typeOf = d => S.scheme.types.find(t => t.id === S.meta[d.id]?.type);
const gwOf = d => S.gateways[d.bridge] || {};
const houseOf = d => S.scheme.houses.find(h => h.id === (S.meta[d.id]?.house || gwOf(d).house || S.scheme.defaultHouse));
const useHouse = () => S.scheme.pattern.includes("{house}");
const useFloor = () => S.scheme.pattern.includes("{floor}");
/** Etage: Auswahl am Gerät, sonst die Etage des Raums (HA-Bereich → HA-Etage), sonst Standard. */
const floorOf = d => {
  const sc = S.scheme, picked = sc.floors.find(f => f.id === S.meta[d.id]?.floor);
  if (picked) return picked;
  const room = roomOf(d), area = S.areas.find(a => a.id === (room?.area_id || d.area_id));
  return sc.floors.find(f => area?.floor_id && f.floor_id === area.floor_id) || sc.floors.find(f => f.id === sc.defaultFloor);
};

/** Berechnet Namensvorschläge für alle Zeilen mit Raum+Typ, die noch nicht dem Schema entsprechen. */
function suggestions() {
  const rows = allRows(), out = new Map();
  const pending = rows.filter(d => typeOf(d) && (!S.scheme.pattern.includes("{room}") || roomOf(d)) && (!useHouse() || houseOf(d)) && (!useFloor() || floorOf(d)));
  const pendIds = new Set(pending.map(d => d.id));
  const used = new Set(rows.filter(d => !pendIds.has(d.id)).map(d => d.name.toLowerCase()));
  for (const d of pending) {
    const room = roomOf(d), type = typeOf(d);
    const name = nextName(S.scheme, room, type, used, houseOf(d), floorOf(d));
    used.add(name.toLowerCase());
    out.set(d.id, name);
  }
  return out;
}

    dlg.style.cssText = "max-width:640px;width:92%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">${count} Gerät(e) umbenennen</h2>
      <p class="sub">Entity-IDs, die sich ändern (${plan.entities.length}):</p>

      ${refs ? `<p class="sub" style="margin-top:12px">Verweise, die angepasst werden (${plan.usages.length}):</p>
      <div class="preview" style="max-height:160px;overflow:auto">${plan.usages.map(u => `${kinds[u.kind] || u.kind}: <b>${esc(u.title)}</b> <span class="sub">(${u.entities.length} Entität${u.entities.length == 1 ? "" : "en"})</span>`).join("<br>") || "keine gefunden"}</div>
      ${plan.unreadable ? `<p class="sub">${plan.unreadable} Automationen/Szenen sind nicht über die Oberfläche lesbar (YAML) und werden <b>nicht</b> angepasst.</p>` : ""}
      ${(plan.notes || []).map(n => `<p class="sub">⚠ ${esc(n)}</p>`).join("")}
      ${S.updateNodered ? `<p class="sub">Node-RED danach neu starten, sonst überschreibt ein Deploy die Änderung.</p>` : ""}
      ${S.updateYaml ? `<p class="sub">YAML geändert: danach Konfiguration prüfen und neu laden.</p>` : ""}
      <p class="sub">Vorher wird eine Sicherung der geänderten Konfigurationen unter /data/backups abgelegt.</p>` : ""}
      <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="no">Abbrechen</button><button class="btn primary" id="yes">Umbenennen</button></div>`;
    document.body.appendChild(dlg); dlg.showModal();
    const end = v => { dlg.close(); dlg.remove(); resolve(v); };
    $("#no", dlg).onclick = () => end(false); $("#yes", dlg).onclick = () => end(true);
    dlg.oncancel = () => end(false);
  });
}

/** Zeigt das Prüfergebnis nach dem Umbenennen; „Erneut prüfen“ liest den aktuellen Stand neu. */
function showChecks(checks, last, errors) {
  return new Promise(resolve => {
    const icon = {ok: "✅", info: "ℹ️", warn: "⚠️", fail: "❌"};
    const dlg = document.createElement("dialog");
    dlg.style.cssText = "max-width:680px;width:92%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
    const draw = list => {
      const bad = list.some(c => c.status === "fail") || errors.length, warn = list.some(c => c.status === "warn");
      dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">${bad ? "❌ Prüfung: nicht alles hat geklappt" : warn ? "⚠️ Prüfung: bitte nachsehen" : "✅ Prüfung: alles wurde angepasst"}</h2>
        <div class="preview" style="line-height:1.6">${list.map(c => `${icon[c.status] || "•"} <b>${esc(c.name)}</b><div class="sub" style="margin:0 0 6px 24px">${esc(c.detail)}</div>`).join("") || "Keine Prüfung verfügbar."}
        ${errors.map(e => `❌ <b>${esc(e.device)}</b><div class="sub" style="margin:0 0 6px 24px">${esc(e.error)}</div>`).join("")}</div>
        <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="re">Erneut prüfen</button><button class="btn primary" id="ok">Schließen</button></div>`;
      $("#ok", dlg).onclick = () => { dlg.close(); dlg.remove(); resolve(); };
      $("#re", dlg).onclick = async () => {
        $("#re", dlg).disabled = true; $("#re", dlg).textContent = "Prüfe…";
        try { draw((await api.verify(last)).checks); } catch (e) { toast("Prüfung fehlgeschlagen: " + e.message); draw(list); }
      };
    };
    draw(checks); document.body.appendChild(dlg); dlg.showModal(); dlg.oncancel = () => { dlg.remove(); resolve(); };
  });
}

/** items: [[device, neuerName], …]. Gibt die Anzahl umbenannter Geräte zurück. */
async function applyBatch(items) {
  const real = items.filter(([d]) => !d.planned);
  for (const [d, name] of items.filter(([d]) => d.planned)) S.planned.find(p => p.id === d.id).name = name;
  if (real.length) {
    try {
      if (S.renameEntities) {
        const plan = await api.plan(real);
        if (!await confirmPlan(plan, real.length)) return 0;
      }
      const res = await api.apply(real);
      for (const [d, name] of real) { const dev = S.devices.find(x => x.id === d.id); dev.name = name; dev.is_new = false; }
      if (res.errors?.length) toast("Fehler: " + res.errors.map(e => e.device + ": " + e.error).join("; "));
      await showChecks(res.checks || [], {items: api.payload(real), renamed: res.renamed_entities || [], opts: api.opts()}, res.errors || []);
    } catch (e) { toast("Fehler: " + e.message); return 0; }
    for (const [d, name] of real) { const dev = S.devices.find(x => x.id === d.id); dev.name = name; dev.is_new = false; }
  }
  persist(); return items.length;
}

async function pollPermit() { if (!$("#tab-gateways").hidden) { try { S.permitReal = await api.permitState(); tickPermit(); } catch (e) {} } }
function tickPermit() {
  document.querySelectorAll("#tab-gateways [data-cd]").forEach(el => {
    const id = el.dataset.cd, left = Math.max(0, Math.round(((S.permitUntil[id] || 0) - Date.now()) / 1000)), real = S.permitReal[id];
    const on = left > 0 || real === "on";
    el.textContent = on ? (left > 0 ? "aktiv · " + Math.floor(left / 60) + ":" + String(left % 60).padStart(2, "0") : "aktiv") : "aus";
    el.style.color = on ? "var(--ok)" : ""; el.style.fontWeight = on ? "600" : "";
  });
}
setInterval(tickPermit, 1000); setInterval(pollPermit, 6000);

        <option value="{room}_{type}_{nr}">{room}_{type}_{nr}  → wz_lp_01</option>
        <option value="{floor}-{room}-{type}{nr}">{floor}-{room}-{type}{nr}  → H1-wzfl-lband01 (H1 = Etage)</option>
        <option value="{house}-{room}-{type}{nr}">{house}-{room}-{type}{nr}  → H1-wzfl-lband01 (H1 = Haus)</option>
        <option value="{house}-{floor}-{room}-{type}{nr}">{house}-{floor}-{room}-{type}{nr}  → A-H1-wzfl-lband01</option>
        <option value="{house}_{room}_{type}_{nr}">{house}_{room}_{type}_{nr}  → H1_wz_lp_01</option></select></div>
      <div class="row"><label>Standard-Etage</label><select id="df"><option value="">–</option>${sc.floors.map(f => `<option value="${f.id}"${f.id === sc.defaultFloor ? " selected" : ""}>${esc(f.abbr)} · ${esc(f.name)}</option>`).join("")}</select><span class="sub">wenn Raum/Bereich keine Etage hat</span></div>
      <div class="row"><label>Standard-Haus</label><select id="dh">${sc.houses.map(h => `<option value="${h.id}"${h.id === sc.defaultHouse ? " selected" : ""}>${esc(h.abbr)} · ${esc(h.name)}</option>`).join("")}</select><span class="sub">für Geräte ohne eigene Haus-Auswahl</span></div>
      <div class="row"><label>Schreibweise</label><select id="case"><option value="upper">GROSS</option><option value="lower">klein</option><option value="keep">wie eingegeben</option></select></div>
      <div class="row"><label>Zähler</label><select id="cst"><option value="arabic">1, 2, 3</option><option value="roman">I, II, III</option><option value="alpha">A, B, C</option></select>
        <input id="cpad" type="number" min="1" max="6" value="${c.pad}" style="width:64px" title="Stellen (nur 1,2,3)" ${c.style === "arabic" ? "" : "disabled"}>
        <span class="sub">Stellen</span><input id="cstart" type="number" min="0" max="999" value="${c.start}" style="width:64px"><span class="sub">Start</span></div>
      <h2 style="margin-top:16px">Vorschau</h2><div class="preview">${ex.map(esc).join("<br>")}</div>
      <p class="sub">Der Zähler zählt je Raum+Typ automatisch hoch und überspringt bereits vergebene Namen.</p>
    </div>
    <div class="panel list"><h2>Häuser / Präfix</h2>${list("houses", sc.houses)}<button class="btn" data-add="houses">＋ Haus</button></div>
    <div class="panel list"><h2>Etagen</h2><p class="sub">z. B. H0 = Erdgeschoss, H1 = 1. Etage, S2 = …; frei wählbar. Etagen aus Home Assistant werden übernommen und per Raum/Bereich automatisch zugeordnet.</p>${list("floors", sc.floors)}<button class="btn" data-add="floors">＋ Etage</button></div>
    <div class="panel list"><h2>Räume</h2>${list("rooms", sc.rooms)}<button class="btn" data-add="rooms">＋ Raum</button> <button class="btn" id="syncAreas" title="Bereiche aus Home Assistant als Räume übernehmen">⟳ Bereiche aus HA</button>${S.areas.length ? "" : ` <span class="sub">(keine Bereiche gefunden)</span>`}</div>
    <div class="panel list"><h2>Gerätetypen</h2>${list("types", sc.types)}<button class="btn" data-add="types">＋ Typ</button></div>
  </div>`;
  const root = $("#tab-scheme");
  $("#case", root).value = sc.case; $("#cst", root).value = c.style;
  const upd = () => { persist(); renderScheme(); };
  $("#pat", root).onchange = e => { sc.pattern = e.target.value; upd(); };
  root.querySelectorAll("[data-tok]").forEach(b => b.onclick = () => { sc.pattern += b.dataset.tok; upd(); });
  $("#ex", root).onchange = e => { if (e.target.value) { sc.pattern = e.target.value; if (/\{(house|floor)\}/.test(e.target.value)) sc.case = "keep"; upd(); } };
  $("#df", root).onchange = e => { sc.defaultFloor = e.target.value; upd(); };
  $("#dh", root).onchange = e => { sc.defaultHouse = e.target.value; upd(); };
  $("#syncAreas", root).onclick = () => { sc.ignoredAreas = []; sc.ignoredFloors = []; syncFloors(); const n = syncAreas(); toast(n ? n + " Räume aus Home Assistant übernommen" : "Alle Bereiche sind schon vorhanden"); renderScheme(); };
  $("#case", root).onchange = e => { sc.case = e.target.value; upd(); };
  $("#cst", root).onchange = e => { c.style = e.target.value; upd(); };
  $("#cpad", root).onchange = e => { c.pad = Math.max(1, +e.target.value || 1); upd(); };
  $("#cstart", root).onchange = e => { c.start = Math.max(0, +e.target.value || 0); upd(); };
  root.querySelectorAll(".list .row").forEach(row => {
    const kind = row.parentElement.querySelector("[data-add]").dataset.add, item = sc[kind].find(i => i.id === row.dataset.id);
    row.querySelectorAll("input").forEach(inp => inp.onchange = () => { item[inp.dataset.k] = inp.value.trim(); upd(); });
    row.querySelector("[data-del]").onclick = () => {
      if (item.area_id) sc.ignoredAreas = [...(sc.ignoredAreas || []), item.area_id]; // nicht automatisch neu anlegen
      if (item.floor_id) sc.ignoredFloors = [...(sc.ignoredFloors || []), item.floor_id];
      sc[kind] = sc[kind].filter(i => i !== item); upd();
    };
  });
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => { sc[b.dataset.add].push({id: uid("x"), name: "Neu", abbr: "NE"}); upd(); });
}

// ---------- Export-Tab ----------
function renderExport() {
  $("#tab-export").innerHTML = `<div class="grid">
    <div class="panel"><h2>Geräteliste</h2><p class="sub">Alle Geräte mit aktuellem Namen, Raum, Typ und IEEE.</p>
      <button class="btn primary" id="csv">CSV herunterladen</button> <button class="btn" id="json">JSON herunterladen</button></div>
    <div class="panel"><h2>Namensschema</h2><p class="sub">Schema (Muster, Räume, Typen) sichern oder auf einer anderen Instanz laden.</p>
      <button class="btn" id="sExp">Schema exportieren</button> <button class="btn" id="sImp">Schema importieren…</button>
      <input type="file" id="sFile" accept="application/json" hidden></div>
  </div>`;
  const rows = () => allRows().map(d => ({name: d.name, ieee: d.ieee, hersteller: d.manufacturer, modell: d.model, ha_bereich: d.area, haus: houseOf(d)?.name || "", etage: floorOf(d)?.name || "", raum: roomOf(d)?.name || "", typ: typeOf(d)?.name || "", status: d.planned ? "geplant" : d.is_new ? "neu" : "benannt"}));
  $("#csv").onclick = () => {
    const r = rows(), h = Object.keys(r[0] || {name: ""});
    download("zigbee-geraete.csv", [h, ...r.map(o => h.map(k => o[k]))].map(l => l.map(v => `"${String(v).replaceAll('"', '""')}"`).join(";")).join("\n"), "text/csv");
  };
  $("#json").onclick = () => download("zigbee-geraete.json", JSON.stringify(rows(), null, 2), "application/json");
  $("#sExp").onclick = () => download("namensschema.json", JSON.stringify(S.scheme, null, 2), "application/json");
  $("#sImp").onclick = () => $("#sFile").click();
  $("#sFile").onchange = async e => {
    try {
      const s = JSON.parse(await e.target.files[0].text());
      if (!s.pattern || !Array.isArray(s.rooms) || !Array.isArray(s.types) || !s.counter) throw new Error("Ungültiges Schema");
      S.scheme = {houses: clone(DEFAULT_SCHEME.houses), defaultHouse: DEFAULT_SCHEME.defaultHouse, floors: clone(DEFAULT_SCHEME.floors), ...s}; persist(); toast("Schema importiert");
    } catch (err) { toast("Import fehlgeschlagen: " + err.message); }
  };
}

// ---------- Start ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== "tab-" + b.dataset.tab);
  ({devices: renderDevices, gateways: renderGateways, scheme: renderScheme, export: renderExport})[b.dataset.tab]();
});

(async () => {
  const data = await api.load();
  S.devices = data.devices; S.bridges = data.bridges || [];
  const st = data.store || {};
  S.gateways = st.gateways || {};
  S.areas = data.areas || []; S.haFloors = data.floors || [];
  if (st.scheme?.pattern) S.scheme = {houses: clone(DEFAULT_SCHEME.houses), defaultHouse: DEFAULT_SCHEME.defaultHouse, floors: clone(DEFAULT_SCHEME.floors), ...st.scheme};
  S.meta = st.meta || {}; S.planned = st.planned || [];
  if (api.error) $("#banner").innerHTML = `<div class="banner" style="border-left-color:var(--new)"><b>Verbindung zu Home Assistant fehlgeschlagen.</b> Das Add-on läuft, kann aber keine Geräte laden – keine Demo-Daten.<br><code>${esc(api.error)}</code><br><button class="btn" style="margin-top:8px" onclick="location.reload()">Erneut versuchen</button> <a href="api/diag" target="_blank">Diagnose öffnen</a> <span class="sub">(Details auch im Add-on-Log)</span></div>`;
  else if (api.demo) $("#banner").innerHTML = `<div class="banner"><b>Demo-Modus:</b> Beispieldaten, Änderungen bleiben nur in diesem Browser (localStorage). Im Home-Assistant-Add-on werden echte Zigbee-Geräte geladen und umbenannt.</div>`;
  S.scheme.floors = S.scheme.floors || clone(DEFAULT_SCHEME.floors); S.scheme.defaultFloor = S.scheme.defaultFloor || "";
  syncFloors(); syncAreas();
  renderDevices();
})();
</script>
