name: Gerätemanager
version: "0.18.0"
slug: zigbee_devices_manager
description: Alle Geräte aus Home Assistant zentral benennen – Zigbee, Matter, Shelly und jede andere Integration – mit Namensschema, Kürzeln und automatischem Hochzählen.
url: https://github.com/BuRnEd4AiM/Zigbee-Devices-Manager
arch:
  - amd64
  - aarch64
  - armv7
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:tag-multiple
panel_title: Gerätemanager
panel_admin: true
homeassistant_api: true
# nur lesend: findet die Oberfläche (Ingress) der Zigbee2MQTT-Add-ons für den Knopf „ⓘ Z2M“
hassio_api: true
map:
  - type: homeassistant_config
    read_only: false
    path: /homeassistant
  - type: all_addon_configs
    read_only: false
options:
  z2m_base_topic: zigbee2mqtt
schema:
  z2m_base_topic: str
