setInterval(tickPermit, 1000); setInterval(pollPermit, 6000);

// ---------- Netzwerk-Tab ----------
/* Zeigt das Zigbee-Netz einer Zigbee2MQTT-Instanz als Baum (Logik in zigbee-tree.js): wer hängt an wem, wie gut ist die
   Verbindung (LQI). Ein neuer Scan läuft nur auf Knopfdruck; angezeigt wird der letzte Scan (oder ein vorhandener Sensor). */
const NET = {inst: "", data: {}, trees: {}, sel: "", collapsed: new Set(), alt: new Set(), q: "", weak: false, type: "", poll: {}};
const NET_TYPES = {Coordinator: ["KO", "Koordinator", "coord"], Router: ["R", "Router", "router"], EndDevice: ["E", "Endgerät", "end"], Unknown: ["?", "Typ unbekannt", "end"]};
const NET_ROLES = {parent: "Parent", child: "Kind", sibling: "Nachbar", none: "–"};
const netThresholds = () => (Array.isArray(S.network?.thresholds) && S.network.thresholds.length === 3 ? S.network.thresholds : [30, 80, 150]);

/** Zigbee2MQTT-Instanzen aus den Gateways: Bezeichnung, Basis-Topic, Koordinator-IEEE. */
function netInstances() {
  return S.bridges.filter(b => b.source === "z2m").map(b => ({id: b.id, label: S.gateways[b.id]?.label || b.name,
    base: S.gateways[b.id]?.topic || z2mInfoOf(b.id)?.base_topic || (api.demo ? (b.id === "b1" ? "zigbee2mqtt" : "zigbee2mqtt_2") : ""), coord: b.ieee || ""}));
}

/** Beispiel-Netz für die Demo aus den Demo-Geräten (Lampen und Steckdosen sind Router). */
function demoNetwork(bridgeId) {
  const coord = bridgeId === "b1" ? "0x00124b0000c00001" : "0x00124b0000c00002";
  const devs = DEMO_DEVICES.map((d, i) => ({d, i})).filter(({d}) => d.bridge === bridgeId && d.model !== "CC2652P");
  const nodes = [{ieeeAddr: coord, friendlyName: "Coordinator", type: "Coordinator", networkAddress: 0}, ...devs.map(({d, i}) => ({
    ieeeAddr: d.ieee, friendlyName: d.name, type: /bulb|Hue|TS011F/i.test(d.orig_name) ? "Router" : "EndDevice", networkAddress: 0x1000 + i * 17,
    lastSeen: Date.now() - (d.ieee.endsWith("c5") ? 400 * 86400e3 : (i + 1) * 95e3), definition: {model: d.model, vendor: d.manufacturer}}))];
  const id = k => (k === "C" ? coord : DEMO_DEVICES[k].ieee);
  // [Tabelle von, über, LQI, relationship]
  const L = bridgeId === "b1"
    ? [["C", 0, 180, 2], [0, "C", 170, 0], ["C", 3, 60, 2], [3, "C", 75, 0], [0, 1, 150, 2], [1, 0, 160, 2], [0, 3, 140, 2], [3, 0, 120, 2],
       [1, 2, 90, 2], [2, 1, 85, 2], ["C", 2, 25, 2], [2, "C", 0, 2], [1, 4, 110, 1], [0, 6, 45, 1], ["C", 7, 130, 1]]
    : [["C", 9, 120, 2], [9, "C", 130, 0], ["C", 10, 35, 2], [10, "C", 40, 0], [9, 10, 100, 2], [10, 9, 95, 2], [10, 8, 70, 1], [9, 11, 150, 1]];
  return {nodes, links: L.map(([owner, other, lqi, rel]) => ({source: {ieeeAddr: id(other)}, target: {ieeeAddr: id(owner)}, lqi, linkquality: lqi, relationship: rel, depth: other === "C" ? 0 : 1}))};
}

const netApi = {
  demoScans: {},
  async load(inst, statusOnly = false) {
    if (api.demo) {
      const started = this.demoScans[inst.id], running = started && Date.now() - started < 3500;
      const scan = started ? {running, started: new Date(started).toISOString(), finished: running ? "" : new Date(started + 3500).toISOString(), error: ""} : {};
      return {scan, value: demoNetwork(inst.id), scanned_at: new Date(started && !running ? started + 3500 : Date.now() - 3600e3).toISOString(), source: "scan"};
    }
    const q = new URLSearchParams({coordinator: inst.coord});
    if (inst.base) q.set("base_topic", inst.base);
    if (statusOnly) q.set("status", "1");
    const r = await fetch("api/networkmap?" + q);
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async permitVia(inst, router, seconds) {
    if (api.demo) return;
    await api.post("api/permit_join", {source: "z2m", base_topic: inst.base, time: seconds, device: router});
  },
  async start(inst) {
    if (api.demo) { this.demoScans[inst.id] = Date.now(); return {running: true, started: new Date().toISOString()}; }
    return api.post("api/networkmap", {base_topic: inst.base});
  }
};

async function loadNetwork(inst) {
  try { NET.data[inst.id] = await netApi.load(inst); } catch (e) { NET.data[inst.id] = {error: e.message}; }
  NET.data[inst.id].base = inst.base; // Basis-Topic kann erst nach dem Laden erkannt werden – dann neu laden
  if (NET.data[inst.id].scan?.running) pollScan(inst);
  if (!$("#tab-network").hidden) renderNetwork();
}
/** Reiter öffnen bzw. Instanz wechseln: sofort den bekannten Stand zeigen, dann still nachsehen, ob es eine neuere Karte gibt
 *  (z. B. weil sie inzwischen in der Oberfläche von Zigbee2MQTT geladen wurde). */
async function netEnter() {
  renderNetwork();
  const inst = netInstances().find(i => i.id === NET.inst), d = inst && NET.data[inst.id];
  if (!d || d.scan?.running || d.base !== inst.base) return;
  try {
    const fresh = await netApi.load(inst);
    if (fresh.scanned_at !== d.scanned_at || !!fresh.scan?.error !== !!d.scan?.error) { NET.data[inst.id] = {...fresh, base: inst.base}; if (!$("#tab-network").hidden) renderNetwork(); }
  } catch (e) { /* bekannter Stand bleibt */ }
}
/** Fragt während eines Scans alle 2 s nach dem Stand; aktualisiert nur die Statuszeile, am Ende den ganzen Baum. */
function pollScan(inst) {
  if (NET.poll[inst.id]) return;
  const tick = async () => {
    let st;
    try { st = (await netApi.load(inst, true)).scan || {}; } catch (e) { st = NET.data[inst.id]?.scan || {}; }
    NET.data[inst.id] = {...NET.data[inst.id], scan: st};
    if (st.running) { if (NET.inst === inst.id) netStatus(); NET.poll[inst.id] = setTimeout(tick, 2000); return; }
    delete NET.poll[inst.id];
    toast(st.error ? "Netzwerk-Scan fehlgeschlagen" : "Netzwerk-Scan fertig – Baum aktualisiert");
    await loadNetwork(inst);
  };
  NET.poll[inst.id] = setTimeout(tick, 2000);
}
function netStatus() {
  const box = $("#netStatus"), inst = netInstances().find(i => i.id === NET.inst);
  if (!box || !inst) return;
  const sc = NET.data[inst.id]?.scan || {}, secs = sc.started ? Math.max(0, Math.round((Date.now() - new Date(sc.started)) / 1000)) : 0;
  const z = sc.z2m || {}, silent = z.no_answer || [];
  // Fortschritt laut Z2M-Log: wer nicht antwortet, kostet je ~25 s (Wartezeit, Pause, zweiter Versuch)
  const hint = z.finished ? "Zigbee2MQTT ist fertig – Ergebnis kommt …"
    : silent.length ? `Antworten nicht: ${silent.map(esc).join(", ")} <span class="sub">(je ~25 s Wartezeit)</span>`
    : secs > 20 && !z.started ? `<span class="sub">noch keine Meldung von Zigbee2MQTT</span>`
    : secs > 60 ? `<span class="sub">Router, die nicht antworten (z. B. Lampen am Wandschalter aus), kosten je ~25 s</span>`
    : `<span class="sub">(dauert meist 10–60 s)</span>`;
  box.innerHTML = sc.running ? `<span class="spin"></span> Scan läuft … ${secs} s · ${hint}` : "";
  const btn = $("#netScan");
  if (btn) { btn.disabled = !!sc.running || !inst.base; btn.textContent = sc.running ? "Scan läuft …" : "Scan starten"; }
}

const netAgo = ms => {
  if (!ms) return "–";
  const s = Math.round((Date.now() - ms) / 1000);
  const txt = s < 90 ? "gerade eben" : s < 5400 ? `vor ${Math.round(s / 60)} Min.` : s < 129600 ? `vor ${Math.round(s / 3600)} Std.` : s < 86400 * 60 ? `vor ${Math.round(s / 86400)} Tagen` : `vor ${Math.round(s / 86400 / 30.4)} Monaten`;
  return `<span title="${esc(new Date(ms).toLocaleString("de-DE"))}">${txt}</span>`;
};

function renderNetwork() {
  const root = $("#tab-network");
  if (typeof ZigbeeTree === "undefined") { root.innerHTML = `<div class="banner">Das Netzwerk-Modul wurde nicht geladen – bitte die Seite neu laden.</div>`; return; }

  if (!insts.length) { root.innerHTML = `<div class="panel"><h2>Netzwerk</h2><p class="sub">Keine Zigbee2MQTT-Instanz gefunden. Der Netzwerk-Baum zeigt Zigbee2MQTT-Netze (ZHA wird hier nicht unterstützt).</p></div>`; return; }
  if (!insts.some(i => i.id === NET.inst)) NET.inst = insts[0].id;
  const inst = insts.find(i => i.id === NET.inst), d = NET.data[inst.id];
  const head = `<div class="bar">

      <span class="sub">${inst.base ? `Basis-Topic <code>${esc(inst.base)}</code>` : "Basis-Topic unbekannt – im Tab „Gateways“ eintragen"}</span>

      <span style="flex:1"></span><span id="netStatus"></span>
      <button class="btn primary" id="netScan" title="Fragt alle Router nach ihren Nachbarn und deren Empfang (LQI). Belastet das Netz kurz, deshalb nur auf Knopfdruck.">Scan starten</button>
    </div>${d?.scan?.error && !(d.scanned_at && d.scan.started && new Date(d.scanned_at) >= new Date(d.scan.started)) ? `<div class="banner" style="border-left-color:var(--new)">${esc(d.scan.error)}</div>` : ""}`;
  if (!d || (d.base !== inst.base && !d.scan?.running)) { root.innerHTML = head + `<p class="sub"><span class="spin"></span> Lade …</p>`; netBind(root, inst); netStatus(); loadNetwork(inst); return; }
  if (d.error || !d.value) {
    root.innerHTML = head + `<div class="panel"><p>${d.error ? "Netzwerkdaten nicht lesbar: " + esc(d.error) : "Für diese Instanz gibt es noch keinen Scan."}</p>

    netBind(root, inst); netStatus(); return;
  }
  let t = NET.trees[inst.id];
  if (!t || t.key !== d.scanned_at) {
    try { t = ZigbeeTree.build(d.value); t.key = d.scanned_at; NET.trees[inst.id] = t; }
    catch (e) { root.innerHTML = head + `<div class="banner">Netzwerkkarte nicht lesbar: ${esc(e.message)}</div>`; netBind(root, inst); return; }
  }
  const th = netThresholds(), cls = v => ZigbeeTree.lqiClass(v, th);
  const name = k => t.all.get(k)?.node.name || k;
  // Wert links: Parent/Nachbar hört dieses Gerät · rechts: dieses Gerät hört Parent/Nachbar
  const val = l => (l.lqiOut !== null && l.lqiIn !== null && l.lqiOut !== l.lqiIn ? `${l.lqiOut} / ${l.lqiIn}` : `${l.lqiOut ?? l.lqiIn}`);
  const badge = (l, me, other) => `<span class="q ${cls(l.lqi)}" title="${esc(`${other} hört ${me}: ${l.lqiOut ?? "–"} · ${me} hört ${other}: ${l.lqiIn ?? "–"}${l.lqiOut === 0 || l.lqiIn === 0 ? " (0 = kein aktueller Messwert)" : ""}`)}">${val(l)}</span>`;
  const weakOf = n => n.link && ["weak", "bad"].includes(cls(n.link.lqi));
  const filtering = !!(NET.q || NET.weak || NET.type);
  const q = NET.q.toLowerCase();
  const match = n => (!q || [n.node.name, n.ieee, n.node.model, n.node.vendor].join(" ").toLowerCase().includes(q)) && (!NET.weak || weakOf(n)) && (!NET.type || n.node.type === NET.type);
  let visible = null;
  if (filtering) {
    visible = new Set();
    for (const n of t.all.values()) if (match(n)) for (let x = n; x && !visible.has(x.ieee); x = x.parent ? t.all.get(x.parent) : null) visible.add(x.ieee);
  }
  const routing = k => ["Coordinator", "Router"].includes(t.all.get(k)?.node.type) && !t.all.get(k)?.node.placeholder;
  const row = n => {
    const kids = n.children.filter(c => !visible || visible.has(c.ieee)), open = filtering || !NET.collapsed.has(n.ieee);
    const others = n === t.coordinator ? [] : n.neighbors.filter(e => e.ieee !== n.parent && !n.children.some(c => c.ieee === e.ieee) && routing(e.ieee));
    const [short, long, tc] = NET_TYPES[n.node.type] || NET_TYPES.Unknown;
    return `<div class="tn ${tc}${NET.sel === n.ieee ? " sel" : ""}" data-ieee="${esc(n.ieee)}">
        ${kids.length ? `<button class="tw" data-tog="${esc(n.ieee)}" title="${open ? "Zuklappen" : "Aufklappen"}">${open ? "▾" : "▸"}</button>` : `<span class="tw"></span>`}
        <span class="ty ${tc}" title="${long}">${short}</span><span class="nm">${esc(n.node.name)}</span>

        ${n.link ? badge(n.link, n.node.name, name(n.parent)) : ""}
        ${n.guessed ? `<span class="sub" title="Kein Parent-Eintrag im Scan – angehängt an den stärksten Router-Nachbarn">vermutet</span>` : ""}
        ${n.node.placeholder ? `<span class="sub" title="Steht in einer Nachbartabelle, ist Zigbee2MQTT aber nicht (mehr) bekannt">nicht in Z2M</span>` : ""}
        ${n.node.failed.includes("lqi") ? `<span class="sub" title="Dieser Router hat auf den Scan nicht geantwortet – nur die Sicht seiner Nachbarn ist bekannt">⚠ keine Antwort</span>` : ""}
        ${others.length ? `<button class="alt" data-alt="${esc(n.ieee)}" title="Andere Router in Reichweite – darüber könnte das Gerät auch gehen">${NET.alt.has(n.ieee) ? "▴" : "▾"} ${others.length} Alternative${others.length === 1 ? "" : "n"}</button>` : ""}
      </div>
      ${NET.alt.has(n.ieee) && others.length ? `<div class="altlist">${others.map(e => `<div>${badge(e, n.node.name, name(e.ieee))}<a href="#" data-goto="${esc(e.ieee)}">${esc(name(e.ieee))}</a><span>${NET_ROLES[e.role]}</span></div>`).join("")}</div>` : ""}
      ${kids.length && open ? `<div class="tsub">${kids.map(row).join("")}</div>` : ""}`;
  };
  const unc = t.unconnected.filter(u => !visible || visible.has(u.ieee)), uncOpen = filtering || !NET.collapsed.has("__unc");
  const weakCount = [...t.all.values()].filter(weakOf).length;
  const scrolled = $(".nettree", root)?.scrollTop || 0;
  root.innerHTML = head + `
    <div class="bar">
      <input id="netQ" type="search" placeholder="Gerät suchen (Name, IEEE, Modell) …" value="${esc(NET.q)}" style="width:250px">
      <div class="chips"><button data-nf="" class="${NET.weak ? "" : "on"}">Alle</button><button data-nf="weak" class="${NET.weak ? "on" : ""}" title="Verbindungen zum Parent unter ${th[1]}">Schwache Verbindungen (${weakCount})</button></div>
      <select id="netType"><option value="">Alle Typen</option><option value="Router"${NET.type === "Router" ? " selected" : ""}>Router</option><option value="EndDevice"${NET.type === "EndDevice" ? " selected" : ""}>Endgeräte</option></select>
      <button class="btn" id="netOpen">Alles auf</button><button class="btn" id="netClose">Alles zu</button>
      <span style="flex:1"></span>
      <span class="sub" title="Rot unter der ersten Grenze, orange bis zur zweiten, gelb bis zur dritten, grün ab der dritten">LQI-Grenzen</span>
      ${th.map((v, i) => `<input class="netTh" data-i="${i}" type="number" min="0" max="255" value="${v}" style="width:64px">`).join("")}
    </div>
    <p class="sub" style="margin:-4px 0 10px">${t.stats.devices} Geräte · ${t.stats.routers} Router · ${t.stats.endDevices} Endgeräte · ${t.stats.unconnected} nicht verbunden ·
      <span class="q good">≥ ${th[2]}</span> <span class="q ok">${th[1]}–${th[2] - 1}</span> <span class="q weak">${th[0]}–${th[1] - 1}</span> <span class="q bad">&lt; ${th[0]}</span>
      · Wert links: Parent hört das Gerät, rechts: Gerät hört den Parent</p>
    <div class="netwrap">
      <div class="card nettree">${t.coordinator && (!visible || visible.has(t.coordinator.ieee)) ? row(t.coordinator) : ""}
        ${unc.length ? `<div class="grp" data-tog="__unc">${uncOpen ? "▾" : "▸"} Nicht verbunden (${filtering ? unc.length : t.stats.unconnected})
          <span class="sub hide-s" style="font-weight:400">– im Scan ohne Verbindung (z. B. Batterie leer, außer Reichweite, schläft)</span></div>${uncOpen ? `<div class="tsub">${unc.map(row).join("")}</div>` : ""}` : ""}
        ${filtering && !visible.size ? `<p class="empty">Nichts gefunden.</p>` : ""}</div>
      <div class="panel netdetail" id="netDetail"></div>
    </div>`;
  $(".nettree", root).scrollTop = scrolled;
  netBind(root, inst);
  netShowDetail(t, inst);
  netStatus();
  if (d.scan?.running) pollScan(inst);
}

/** „(zwischen A und B)“: wo auf dem Weg die schwächste Verbindung liegt. */
function weakestHop(t, path) {
  let worst = null;
  for (const k of path.slice(1)) { const x = t.all.get(k); if (x?.link && (!worst || x.link.lqi < worst.link.lqi)) worst = x; }
  return worst && path.length > 2 ? ` <span class="sub">zwischen ${esc(t.all.get(worst.parent)?.node.name || "")} und ${esc(worst.node.name)}</span>` : "";
}
/** „Besser verbinden“: Einen Weg vorschreiben kann man in Zigbee nicht – ein Endgerät lässt sich aber gezielt über einen
 *  Router neu anlernen und hängt dann an diesem. Router suchen sich ihren Weg selbst. */
function netBetter(t, n) {
  const nd = n.node, th = netThresholds();
  if (nd.placeholder || nd.type === "Coordinator") return "";
  const head = `<h2 style="font-size:14px;margin:14px 0 4px">Besser verbinden</h2>`;
  if (nd.type === "Router") {
    return head + `<p class="sub">Router suchen sich ihren Weg selbst und wechseln von allein, wenn ein besserer da ist – vorschreiben lässt sich das nicht.
      Helfen kann: ein Repeater oder weiterer Router zwischen ihm und ${n.parent ? esc(t.all.get(n.parent).node.name) : "dem Koordinator"}, Lampen nicht am Wandschalter ausschalten
      (ausgeschaltete Router unterbrechen Wege), Abstand zu WLAN-Router und USB-3-Geräten.</p>`;
  }
  const area = k => S.devices.find(x => (x.ieee || "").toLowerCase() === k)?.area || "";
  const mine = area(n.ieee);
  const cands = [...t.all.values()]
    .filter(x => ["Coordinator", "Router"].includes(x.node.type) && !x.node.placeholder && x.bottleneck !== null && !x.node.failed.includes("lqi"))
    .map(x => ({x, same: !!mine && area(x.ieee) === mine, b: Number.isFinite(x.bottleneck) ? x.bottleneck : 255, room: area(x.ieee)}))
    .sort((a, b) => (b.same - a.same) || (b.b - a.b) || a.x.node.name.localeCompare(b.x.node.name, "de"));
  if (!cands.length) return head + `<p class="sub">Im Scan ist kein erreichbarer Router, über den sich das Gerät anlernen ließe.</p>`;
  const best = cands[0];
  const advice = best.x.ieee === n.parent
    ? `Hängt schon am stärksten Router${best.same ? ` im Raum „${esc(mine)}“` : ""}.`
    : `Vorschlag: <b>${esc(best.x.node.name)}</b>${best.same ? ` (gleicher Raum)` : best.room ? ` (${esc(best.room)})` : ""} – Weg zum Koordinator ${q2(best.b, th)}.`;
  return head + `<p class="sub">Einen Weg vorschreiben kann man in Zigbee nicht. Ein Endgerät bleibt aber bei seinem Parent, bis es ihn verliert –
      lernst du es gezielt <b>nur über einen bestimmten Router</b> neu an, hängt es danach an diesem. Wähle einen Router in der Nähe des Geräts mit starkem Weg zum Koordinator.</p>
    <p style="margin:6px 0">${advice}</p>
    <div class="row"><select id="netVia" style="flex:1;min-width:0">${cands.map(c => `<option value="${esc(c.x.ieee)}">${esc(c.x.node.name)}${c.same ? " · gleicher Raum" : c.room ? " · " + esc(c.room) : ""} · Weg ${c.b}${c.x.ieee === n.parent ? " · jetzt" : ""}</option>`).join("")}</select></div>
    <button class="btn" id="netViaGo" title="Erlaubt 4 Minuten lang das Anlernen nur über den gewählten Router">Über diesen Router neu anlernen</button>
    <div id="netViaInfo"></div>`;
}
const q2 = (v, th) => `<span class="q ${ZigbeeTree.lqiClass(v, th)}">${v}</span>`;
/** Detailbereich zum gewählten Gerät. */
function netShowDetail(t, inst) {
  const box = $("#netDetail"), n = t.all.get(NET.sel);
  if (!box) return;
  if (!n) { box.innerHTML = `<h2>Details</h2><p class="sub">Gerät im Baum anklicken: Typ, IEEE, Parent, Weg zum Koordinator, alle Nachbarn mit LQI und wann es zuletzt gesehen wurde.</p>`; return; }
  const th = netThresholds(), q = v => (v === null || v === undefined ? `<span class="sub">–</span>` : `<span class="q ${ZigbeeTree.lqiClass(v, th)}">${v}</span>`);
  const name = k => t.all.get(k)?.node.name || k, nd = n.node;
  const dev = S.devices.find(x => (x.ieee || "").toLowerCase() === n.ieee);
  const path = ZigbeeTree.pathTo(t, n.ieee);
  const failed = {lqi: "Nachbartabelle (LQI) nicht abrufbar", routingTable: "Routing-Tabelle nicht abrufbar"};
  box.innerHTML = `<h2 style="margin:0 0 2px">${esc(nd.name)}</h2>
    <div class="sub">${(NET_TYPES[nd.type] || NET_TYPES.Unknown)[1]}${nd.vendor || nd.model ? " · " + esc([nd.vendor, nd.model].filter(Boolean).join(" ")) : ""}${nd.placeholder ? " · Zigbee2MQTT nicht bekannt" : ""}</div>
    ${dev ? `<div class="links" style="margin:8px 0">${openLinks(dev)}</div>` : ""}
    <div class="kv">
      <span>IEEE</span><code>${esc(n.ieee)}</code>
      <span>Netzwerkadresse</span><code>${nd.nwk === null ? "–" : "0x" + nd.nwk.toString(16).padStart(4, "0")}</code>
      <span>Parent</span><span>${n.parent ? `<a href="#" data-goto="${esc(n.parent)}">${esc(name(n.parent))}</a> ${q(n.link?.lqi)}${n.guessed ? ` <span class="sub">vermutet</span>` : ""}` : n === t.coordinator ? "– (Wurzel)" : "nicht verbunden"}</span>
      ${path.length > 1 && path[0] === t.coordinator?.ieee ? `<span>Weg</span><span>${path.map(k => esc(name(k))).join(" → ")}</span><span>Schwächste Stelle</span><span>${q(Number.isFinite(n.bottleneck) ? n.bottleneck : null)}${weakestHop(t, path)}</span>` : ""}
      ${n.children.length ? `<span>Hängen dran</span><span>${n.children.length} direkt, ${n.descendants} insgesamt</span>` : ""}
      <span>Zuletzt gesehen</span><span>${nd.type === "Coordinator" ? "–" : netAgo(nd.lastSeen)}</span>
      ${dev ? `<span>In Home Assistant</span><span>${esc(dev.name)}${dev.area ? " · " + esc(dev.area) : ""}</span>` : ""}
      ${nd.failed.length ? `<span>Scan</span><span>⚠ ${nd.failed.map(f => esc(failed[f] || f)).join(", ")}</span>` : ""}
    </div>
    <h2 style="font-size:14px;margin:14px 0 4px">Nachbarn (${n.neighbors.length})</h2>
    ${n.neighbors.length ? `<table class="nbt"><thead><tr><th>Gerät</th><th>Rolle</th><th title="Wie gut der Nachbar dieses Gerät empfängt">hört es</th><th title="Wie gut dieses Gerät den Nachbarn empfängt">hört ihn</th></tr></thead>
      <tbody>${n.neighbors.map(e => `<tr data-goto="${esc(e.ieee)}"><td>${esc(name(e.ieee))}</td><td class="sub">${NET_ROLES[e.role]}</td><td>${q(e.lqiOut)}</td><td>${q(e.lqiIn)}</td></tr>`).join("")}</tbody></table>`
      : `<p class="sub">Keine Nachbarn im Scan.</p>`}`;
  box.insertAdjacentHTML("beforeend", netBetter(t, n));
  box.querySelectorAll("[data-goto]").forEach(el => el.onclick = e => { e.preventDefault(); netGoto(el.dataset.goto); });
  const cur = inst || netInstances().find(i => i.id === NET.inst);
  $("#netViaGo", box) && ($("#netViaGo", box).onclick = async () => {
    const via = $("#netVia", box).value, viaName = name(via), info = $("#netViaInfo", box);
    try {
      await netApi.permitVia(cur, via, 240);
      info.innerHTML = `<div class="banner" style="border-left-color:var(--ok);color:var(--fg);margin-top:8px"><b>Anlernen nur über ${esc(viaName)} ist 4 Minuten offen.</b><br>
        Jetzt ${esc(nd.name)} neu koppeln: Anlern-/Reset-Knopf drücken, bis es blinkt (bei SONOFF-Sensoren etwa 5 s halten). Zigbee2MQTT erkennt das Gerät an seiner IEEE – Name und Einstellungen bleiben.
        Danach „Scan starten“, um den neuen Parent zu sehen.<br><button class="btn" id="netViaStop" style="margin-top:6px">Anlernen beenden</button></div>`;
      $("#netViaStop", box).onclick = async () => { try { await netApi.permitVia(cur, "", 0); toast("Anlernen beendet"); info.innerHTML = ""; } catch (e) { toast("Fehler: " + e.message); } };
    } catch (e) { toast("Anlernen nicht gestartet: " + e.message); }
  });
  if (dev) {
    $(".lnk.ha", box) && ($(".lnk.ha", box).onclick = e => haNavigate(e, haDevicePath(dev)));
    $(".lnk.z2m", box) && ($(".lnk.z2m", box).onclick = e => openZ2m(e, z2mLink(dev)));
    $(".lnk.off", box) && ($(".lnk.off", box).onclick = () => showTab("gateways"));
  }
}
/** Gerät auswählen; zugeklappte Äste darüber öffnen und hinscrollen. */
function netGoto(ieee) {
  const t = NET.trees[NET.inst];
  if (!t?.all.has(ieee)) return;
  NET.sel = ieee;
  let opened = false;
  for (let x = t.all.get(ieee); x?.parent; x = t.all.get(x.parent)) if (NET.collapsed.delete(x.parent)) opened = true;
  if (!t.all.get(ieee).parent && t.all.get(ieee) !== t.coordinator && NET.collapsed.delete("__unc")) opened = true;
  const row = document.querySelector(`#tab-network .tn[data-ieee="${CSS.escape(ieee)}"]`);
  if (opened || !row) { if (!row) { NET.q = ""; NET.weak = false; NET.type = ""; } renderNetwork(); }
  else { document.querySelectorAll("#tab-network .tn.sel").forEach(el => el.classList.remove("sel")); row.classList.add("sel"); netShowDetail(t); }
  document.querySelector(`#tab-network .tn[data-ieee="${CSS.escape(ieee)}"]`)?.scrollIntoView({block: "nearest"});
}

function netBind(root, inst) {
  root.querySelectorAll("[data-inst]").forEach(b => b.onclick = () => { NET.inst = b.dataset.inst; NET.sel = ""; netEnter(); });
  $("#netScan", root) && ($("#netScan", root).onclick = async () => {
    try {
      const sc = await netApi.start(inst);
      NET.data[inst.id] = {...NET.data[inst.id], scan: sc};
      netStatus(); pollScan(inst);
    } catch (e) { toast("Scan nicht gestartet: " + e.message); }
  });
  const tree = $(".nettree", root);
  if (!tree) return;
  $("#netQ", root).oninput = e => { NET.q = e.target.value; const p = e.target.selectionStart; renderNetwork(); const i = $("#netQ"); i.focus(); i.setSelectionRange(p, p); };
  root.querySelectorAll("[data-nf]").forEach(b => b.onclick = () => { NET.weak = b.dataset.nf === "weak"; renderNetwork(); });
  $("#netType", root).onchange = e => { NET.type = e.target.value; renderNetwork(); };
  $("#netOpen", root).onclick = () => { NET.collapsed.clear(); renderNetwork(); };
  $("#netClose", root).onclick = () => {
    const t = NET.trees[inst.id];
    for (const n of t.all.values()) if (n.children.length && n !== t.coordinator) NET.collapsed.add(n.ieee);
    NET.collapsed.add("__unc"); renderNetwork();
  };
  root.querySelectorAll(".netTh").forEach(inp => inp.onchange = () => {
    const th = [...netThresholds()]; th[+inp.dataset.i] = Math.max(0, Math.min(255, Math.round(+inp.value) || 0));
    if (th[0] <= th[1] && th[1] <= th[2]) { S.network = {...S.network, thresholds: th}; persist(); } else toast("Die Grenzen müssen aufsteigend sein");
    renderNetwork();
  });
  tree.onclick = e => {
    const tog = e.target.closest("[data-tog]"), alt = e.target.closest("[data-alt]"), go = e.target.closest("[data-goto]"), tn = e.target.closest(".tn");
    if (tog) { const k = tog.dataset.tog; NET.collapsed.has(k) ? NET.collapsed.delete(k) : NET.collapsed.add(k); renderNetwork(); return; }
    if (alt) { const k = alt.dataset.alt; NET.alt.has(k) ? NET.alt.delete(k) : NET.alt.add(k); renderNetwork(); return; }
    if (go) { e.preventDefault(); netGoto(go.dataset.goto); return; }
    if (tn) netGoto(tn.dataset.ieee);
  };
}

// ---------- Schema-Tab ----------
function renderScheme() {
  const sc = S.scheme, c = sc.counter, r0 = sc.rooms[0], t0 = sc.types[0], r1 = sc.rooms[1] || r0, h0 = sc.houses[0], h1 = sc.houses[1] || h0, e0 = sc.floors[0], e1 = sc.floors[1] || e0;
  const used = new Set(), ex = [];
  for (const [h, e, r, t] of [[h0, e0, r0, t0], [h0, e0, r0, t0], [h0, e0, r0, t0], [h0, e0, r1, t0], [h0, e1, r0, t0], [h1, e0, r0, t0], [h0, e0, r0, sc.types[1] || t0]]) { const n = nextName(sc, r, t, used, h, e); used.add(n.toLowerCase()); ex.push(n); }
  const list = (kind, items) => items.map(i => `<div class="row" data-id="${i.id}">
      <input data-k="name" value="${esc(i.name)}" placeholder="Name"><input class="abbr" data-k="abbr" value="${esc(i.abbr)}" placeholder="Kürzel" maxlength="8">${i.area_id ? `<span class="badge" title="Mit Home-Assistant-Bereich verknüpft">HA</span>` : ""}
      <button class="x" data-del="${kind}" title="Entfernen">✕</button></div>`).join("");
  $("#tab-scheme").innerHTML = `<div class="grid">
    <div class="panel"><h2>Muster</h2>
      <div class="row"><label>Muster</label><input id="pat" value="${esc(sc.pattern)}" style="flex:1"></div>
      <div class="row"><label></label>${["{house}", "{floor}", "{room}", "{type}", "{nr}"].map(t => `<button class="tok" data-tok="${t}">${t}</button>`).join("")}<span class="sub">Trenner (_ - . Leerzeichen) frei wählbar</span></div>
      <div class="row"><label>Voreinstellung</label><button class="btn" id="presetHF" title="Häuser H und S, Etagen 0–3, Muster {house}{floor}-{room}-{type}{nr}">H0, H1, S2 … (Haus-Buchstabe + Etagennummer)</button></div>
      <div class="row"><label>Beispiele</label><select id="ex"><option value="">Muster wählen…</option>
        <option value="{room}_{type}_{nr}">{room}_{type}_{nr}  → wz_lp_01</option>
        <option value="{house}{floor}-{room}-{type}{nr}">{house}{floor}-{room}-{type}{nr}  → H1-wzfl-lband01 / S2-wzfl-lband01 (Haus-Buchstabe + Etage)</option>
        <option value="{floor}-{room}-{type}{nr}">{floor}-{room}-{type}{nr}  → H1-wzfl-lband01 (H1 = Etage)</option>
        <option value="{house}-{room}-{type}{nr}">{house}-{room}-{type}{nr}  → H1-wzfl-lband01 (H1 = Haus)</option>
        <option value="{house}-{floor}-{room}-{type}{nr}">{house}-{floor}-{room}-{type}{nr}  → A-H1-wzfl-lband01</option>
        <option value="{house}_{room}_{type}_{nr}">{house}_{room}_{type}_{nr}  → H1_wz_lp_01</option></select></div>
      <div class="row"><label>Standard-Etage</label><select id="df"><option value="">–</option>${sc.floors.map(f => `<option value="${f.id}"${f.id === sc.defaultFloor ? " selected" : ""}>${esc(f.abbr)} · ${esc(f.name)}</option>`).join("")}</select><span class="sub">wenn Raum/Bereich keine Etage hat</span></div>
      <div class="row"><label>Standard-Haus</label><select id="dh">${sc.houses.map(h => `<option value="${h.id}"${h.id === sc.defaultHouse ? " selected" : ""}>${esc(h.abbr)} · ${esc(h.name)}</option>`).join("")}</select><span class="sub">für Geräte ohne eigene Haus-Auswahl</span></div>
      <div class="row"><label>Schreibweise</label><select id="case"><option value="upper">GROSS</option><option value="lower">klein</option><option value="keep">wie eingegeben</option></select></div>
      <div class="row"><label>Zähler</label><select id="cst"><option value="arabic">1, 2, 3</option><option value="roman">I, II, III</option><option value="alpha">A, B, C</option></select>
        <input id="cpad" type="number" min="1" max="6" value="${c.pad}" style="width:64px" title="Stellen (nur 1,2,3)" ${c.style === "arabic" ? "" : "disabled"}>
        <span class="sub">Stellen</span><input id="cstart" type="number" min="0" max="999" value="${c.start}" style="width:64px"><span class="sub">Start</span></div>
      <h2 style="margin-top:16px">Vorschau</h2><div class="preview">${ex.map(esc).join("<br>")}</div>
      <p class="sub">Der Zähler zählt je Raum+Typ automatisch hoch und überspringt bereits vergebene Namen.</p>
    </div>
    <div class="panel list"><h2>Häuser / Präfix</h2>${list("houses", sc.houses)}<button class="btn" data-add="houses">＋ Haus</button></div>
    <div class="panel list"><h2>Etagen</h2><p class="sub">Nummer oder Kürzel der Etage (0 = Erdgeschoss, 1, 2, 3 …). Zusammen mit dem Haus ergibt das z. B. H1 oder S2. Etagen aus Home Assistant werden übernommen und per Raum/Bereich automatisch zugeordnet.</p>${list("floors", sc.floors)}<button class="btn" data-add="floors">＋ Etage</button></div>
    <div class="panel list"><h2>Räume</h2>${list("rooms", byName(sc.rooms))}<button class="btn" data-add="rooms">＋ Raum</button> <button class="btn" id="syncAreas" title="Bereiche aus Home Assistant als Räume übernehmen">⟳ Bereiche aus HA</button>${S.areas.length ? "" : ` <span class="sub">(keine Bereiche gefunden)</span>`}</div>
    <div class="panel list"><h2>Gerätetypen</h2>${list("types", byName(sc.types))}<button class="btn" data-add="types">＋ Typ</button></div>
  </div>`;
  const root = $("#tab-scheme");
  $("#case", root).value = sc.case; $("#cst", root).value = c.style;
  const upd = () => { persist(); renderScheme(); };
  $("#pat", root).onchange = e => { sc.pattern = e.target.value; upd(); };
  root.querySelectorAll("[data-tok]").forEach(b => b.onclick = () => { sc.pattern += b.dataset.tok; upd(); });
  $("#presetHF", root).onclick = () => {
    // Haus = Buchstabe (H, S), Etage = Nummer (0, 1, 2 …) → zusammen H1, S2 …; vorhandene Etagen behalten Namen und HA-Verknüpfung
    sc.houses = clone(DEFAULT_SCHEME.houses); sc.defaultHouse = "h1";
    // nur Haus-Buchstaben abtrennen, „U1“ (Untergeschoss) bleibt
    sc.floors.forEach(f => { const m = /^[HhSs](\d+)$/.exec(f.abbr.trim()); if (m) f.abbr = m[1]; });
    sc.pattern = "{house}{floor}-{room}-{type}{nr}"; sc.case = "keep"; upd(); toast("Voreinstellung gesetzt: " + sc.pattern);
  };
  $("#ex", root).onchange = e => { if (e.target.value) { sc.pattern = e.target.value; if (/\{(house|floor)\}/.test(e.target.value)) sc.case = "keep"; upd(); } };
  $("#df", root).onchange = e => { sc.defaultFloor = e.target.value; upd(); };
  $("#dh", root).onchange = e => { sc.defaultHouse = e.target.value; upd(); };
  $("#syncAreas", root).onclick = () => { sc.ignoredAreas = []; sc.ignoredFloors = []; syncFloors(); const n = syncAreas(); toast(n ? n + " Räume aus Home Assistant übernommen" : "Alle Bereiche sind schon vorhanden"); renderScheme(); };
  $("#case", root).onchange = e => { sc.case = e.target.value; upd(); };
  $("#cst", root).onchange = e => { c.style = e.target.value; upd(); };
  $("#cpad", root).onchange = e => { c.pad = Math.max(1, +e.target.value || 1); upd(); };
  $("#cstart", root).onchange = e => { c.start = Math.max(0, +e.target.value || 0); upd(); };
  root.querySelectorAll(".list .row").forEach(row => {
    const kind = row.parentElement.querySelector("[data-add]").dataset.add, item = sc[kind].find(i => i.id === row.dataset.id);
    row.querySelectorAll("input").forEach(inp => inp.onchange = () => { item[inp.dataset.k] = inp.value.trim(); upd(); });
    row.querySelector("[data-del]").onclick = () => {
      if (item.area_id) sc.ignoredAreas = [...(sc.ignoredAreas || []), item.area_id]; // nicht automatisch neu anlegen
      if (item.floor_id) sc.ignoredFloors = [...(sc.ignoredFloors || []), item.floor_id];
      sc[kind] = sc[kind].filter(i => i !== item); upd();
    };
  });
  root.querySelectorAll("[data-add]").forEach(b => b.onclick = () => {
    const item = {id: uid("x"), name: "Neu", abbr: "NE"}; sc[b.dataset.add].push(item); upd();
    // Räume und Typen stehen alphabetisch – der neue Eintrag steht also unter „N“: dorthin springen, Namen zum Überschreiben markieren
    const inp = $(`#tab-scheme .row[data-id="${item.id}"] input[data-k="name"]`);
    if (inp) { inp.scrollIntoView({block: "center"}); inp.focus(); inp.select(); }
  });
}

// ---------- Export-Tab ----------
function renderExport() {
  $("#tab-export").innerHTML = `<div class="grid">
    <div class="panel"><h2>Geräteliste</h2><p class="sub">Alle Geräte mit aktuellem Namen, Raum, Typ und IEEE.</p>
      <button class="btn primary" id="csv">CSV herunterladen</button> <button class="btn" id="json">JSON herunterladen</button></div>
    <div class="panel"><h2>Namensschema</h2><p class="sub">Schema (Muster, Räume, Typen) sichern oder auf einer anderen Instanz laden.</p>
      <button class="btn" id="sExp">Schema exportieren</button> <button class="btn" id="sImp">Schema importieren…</button>
      <input type="file" id="sFile" accept="application/json" hidden></div>
    <div class="panel" style="grid-column:1/-1"><h2>Sicherungen</h2>
      <p class="sub">Namensschema, Zuordnungen (Haus, Etage, Raum, Typ), geplante Geräte, Gateways und die Geräteliste aus Home Assistant werden automatisch gesichert:
        nach Änderungen höchstens stündlich, einmal am Tag, vor jedem Umbenennen und vor jeder Wiederherstellung. Ein unveränderter Stand wird nicht doppelt gesichert.
        Fehlen die Einstellungen beim Start (z. B. nach einer Neuinstallation), holt das Add-on den letzten Stand von selbst zurück.</p>
      <div class="row"><button class="btn primary" id="bkNow">Jetzt sichern</button> <button class="btn" id="bkUp">Sicherung aus Datei laden…</button>
        <input type="file" id="bkFile" accept="application/json" hidden></div>
      <div id="bkBox"><p class="sub">Lade Sicherungen …</p></div></div>
  </div>`;
  const rows = () => allRows().map(d => ({name: d.name, ieee: d.ieee, quelle: SOURCE_NAMES[d.source] || "", hersteller: d.manufacturer, modell: d.model, ha_bereich: d.area, haus: houseOf(d)?.name || "", etage: floorOf(d)?.name || "", raum: roomOf(d)?.name || "", typ: typeOf(d)?.name || "", status: d.planned ? "geplant" : d.is_new ? "neu" : "benannt"}));
  $("#csv").onclick = () => download("zigbee-geraete.csv", toCsv(rows()), "text/csv");
  $("#json").onclick = () => download("zigbee-geraete.json", JSON.stringify(rows(), null, 2), "application/json");
  $("#sExp").onclick = () => download("namensschema.json", JSON.stringify(S.scheme, null, 2), "application/json");
  $("#sImp").onclick = () => $("#sFile").click();
  $("#sFile").onchange = async e => {
    try {
      const s = JSON.parse(await e.target.files[0].text());
      if (!s.pattern || !Array.isArray(s.rooms) || !Array.isArray(s.types) || !s.counter) throw new Error("Ungültiges Schema");
      S.scheme = {houses: clone(DEFAULT_SCHEME.houses), defaultHouse: DEFAULT_SCHEME.defaultHouse, floors: clone(DEFAULT_SCHEME.floors), ...s}; persist(); toast("Schema importiert");
    } catch (err) { toast("Import fehlgeschlagen: " + err.message); }
  };
  $("#bkNow").onclick = async () => {
    try { await api.createBackup(); toast("Sicherung angelegt"); } catch (err) { toast("Sichern fehlgeschlagen: " + err.message); }
    renderBackups();
  };
  $("#bkUp").onclick = () => $("#bkFile").click();
  $("#bkFile").onchange = async e => {
    const f = e.target.files[0]; e.target.value = "";
    try { await restoreBackup({backup: JSON.parse(await f.text())}, "aus der Datei „" + f.name + "“"); } catch (err) { toast("Datei nicht lesbar: " + err.message); }
  };
  renderBackups();
}

const toCsv = rows => { const h = Object.keys(rows[0] || {name: ""}); return [h, ...rows.map(o => h.map(k => o[k] ?? ""))].map(l => l.map(v => `"${String(v).replaceAll('"', '""')}"`).join(";")).join("\n"); };
const fmtDate = iso => { const d = new Date(iso); return isNaN(d) ? iso || "" : d.toLocaleString("de-DE", {dateStyle: "medium", timeStyle: "short"}); };
const BACKUP_REASONS = {auto: "nach Änderungen", taeglich: "täglich", manuell: "von Hand", "vor-umbenennen": "vor dem Umbenennen", "vor-raum": "vor dem Raum-Zuweisen", "vor-loeschen": "vor dem Löschen", "vor-wiederherstellen": "vor einer Wiederherstellung"};

/** Liste der Sicherungen im Export-Tab. */
async function renderBackups() {
  const box = $("#bkBox"); if (!box) return;
  let data;
  try { data = await api.backups(); } catch (e) { box.innerHTML = `<p class="sub">Sicherungen nicht lesbar: ${esc(e.message)}</p>`; return; }
  box.innerHTML = `<p class="sub">Ablage: <code>${esc(data.dir)}</code>${data.persistent ? " – liegt im Home-Assistant-Konfigurationsordner: bleibt bei einer Neuinstallation des Add-ons erhalten und ist in jedem HA-Backup enthalten." : ""}
      Die letzten ${data.keep} Sicherungen werden behalten.</p>
    <div class="card"><table><thead><tr><th>Zeitpunkt</th><th>Anlass</th><th>Geräte</th><th>Zuordnungen</th><th></th></tr></thead><tbody>
    ${data.items.map(b => `<tr data-file="${esc(b.file)}"><td>${esc(fmtDate(b.created))}</td><td>${esc(BACKUP_REASONS[b.reason] || b.reason)}</td><td>${b.devices}</td><td>${b.assigned}</td>
      <td style="white-space:nowrap;text-align:right"><button class="btn bkRestore" title="Schema, Zuordnungen, geplante Geräte und Gateways aus dieser Sicherung zurückholen">Wiederherstellen</button>
        <button class="btn bkJson" title="Sicherung als Datei herunterladen">JSON</button> <button class="btn bkCsv" title="Geräteliste dieser Sicherung als Tabelle">CSV</button></td></tr>`).join("")
      || `<tr><td colspan="5" class="empty">Noch keine Sicherung – die erste entsteht beim nächsten Speichern oder mit „Jetzt sichern“.</td></tr>`}
    </tbody></table></div>`;
  box.querySelectorAll("tr[data-file]").forEach(tr => {
    const file = tr.dataset.file, when = fmtDate(data.items.find(b => b.file === file)?.created);
    const load = async () => { try { return await api.backup(file); } catch (e) { toast("Sicherung nicht lesbar: " + e.message); } };
    $(".bkRestore", tr).onclick = () => restoreBackup({file}, "vom " + when);
    $(".bkJson", tr).onclick = async () => { const b = await load(); if (b) download(file, JSON.stringify(b, null, 2), "application/json"); };
    $(".bkCsv", tr).onclick = async () => { const b = await load(); if (b) download(file.replace(/\.json$/, ".csv"), toCsv(backupRows(b)), "text/csv"); };
  });
}
/** Geräteliste einer Sicherung mit den damaligen Zuordnungen. */
function backupRows(b) {
  const sc = b.store?.scheme || {}, meta = b.store?.meta || {}, nm = (list, id) => (list || []).find(x => x.id === id)?.name || "";
  return (b.devices || []).map(d => ({name: d.name, ieee: d.ieee, quelle: SOURCE_NAMES[d.source] || d.source || "", hersteller: d.manufacturer, modell: d.model, ha_bereich: d.area,
    haus: nm(sc.houses, meta[d.id]?.house), etage: nm(sc.floors, meta[d.id]?.floor), raum: nm(sc.rooms, meta[d.id]?.room), typ: nm(sc.types, meta[d.id]?.type)}));
}
async function restoreBackup(payload, label) {
  if (!confirm(`Einstellungen aus der Sicherung ${label} zurückholen?\n\nNamensschema, Zuordnungen (Haus, Etage, Raum, Typ), geplante Geräte und Gateways werden ersetzt. `
    + `Der aktuelle Stand wird vorher selbst gesichert. Die Gerätenamen in Home Assistant und Zigbee2MQTT bleiben unverändert.`)) return;
  clearTimeout(persist.t); S.storeLoaded = false; // ein noch ausstehendes Speichern darf die Wiederherstellung nicht überschreiben
  try { await api.restoreBackup(payload); toast("Wiederhergestellt – lade neu …"); setTimeout(() => location.reload(), 700); }
  catch (e) { S.storeLoaded = true; toast("Wiederherstellen fehlgeschlagen: " + e.message); }
}

// ---------- Start ----------
document.querySelectorAll("nav button").forEach(b => b.onclick = () => {
  document.querySelectorAll("nav button").forEach(x => x.classList.toggle("on", x === b));
  document.querySelectorAll("main section").forEach(s => s.hidden = s.id !== "tab-" + b.dataset.tab);
  ({devices: renderDevices, gateways: renderGateways, network: netEnter, scheme: renderScheme, export: renderExport})[b.dataset.tab]();
});

(async () => {
  const data = await api.load();
  S.devices = data.devices; S.bridges = data.bridges || [];
  const st = data.store || {};
  S.gateways = st.gateways || {};
  S.areas = data.areas || []; S.haFloors = data.floors || [];
  if (st.scheme?.pattern) S.scheme = {houses: clone(DEFAULT_SCHEME.houses), defaultHouse: DEFAULT_SCHEME.defaultHouse, floors: clone(DEFAULT_SCHEME.floors), ...st.scheme};
  S.meta = st.meta || {}; S.planned = st.planned || []; S.network = st.network || {};
  for (const k of OPTION_KEYS) if (typeof st.options?.[k] === "boolean") S[k] = st.options[k];
  // Ab 0.12 einmalig: Verweise mit anpassen – sonst zeigen Karten nach dem Umbenennen ins Leere (eine Hue-Like-Card zeigt dann nur noch einen Fehler)
  if ((st.optionsRev || 0) < 2) S.updateRefs = true;
  S.storeLoaded = !api.error;
  if (api.error) $("#banner").innerHTML = `<div class="banner" style="border-left-color:var(--new)"><b>Verbindung zu Home Assistant fehlgeschlagen.</b> Das Add-on läuft, kann aber keine Geräte laden – keine Demo-Daten.<br><code>${esc(api.error)}</code><br><button class="btn" style="margin-top:8px" onclick="location.reload()">Erneut versuchen</button> <a href="api/diag" target="_blank">Diagnose öffnen</a> <span class="sub">(Details auch im Add-on-Log)</span></div>`;
  else if (data.restored) $("#banner").innerHTML = `<div class="banner" style="border-left-color:var(--ok)"><b>Einstellungen wiederhergestellt.</b> Es waren keine gespeicherten Einstellungen vorhanden (z. B. nach einer Neuinstallation) – das Add-on hat den Stand vom ${esc(fmtDate(data.restored.created))} zurückgeholt (${esc(data.restored.source)}). Ältere Stände: Tab „Export“ → Sicherungen.</div>`;
  else if (api.demo) $("#banner").innerHTML = `<div class="banner"><b>Demo-Modus:</b> Beispieldaten, Änderungen bleiben nur in diesem Browser (localStorage). Im Home-Assistant-Add-on werden echte Zigbee- und Matter-Geräte geladen und umbenannt.</div>`;
  S.scheme.floors = S.scheme.floors || clone(DEFAULT_SCHEME.floors); S.scheme.defaultFloor = S.scheme.defaultFloor || "";
  syncFloors(); syncAreas();
  syncFromNames(false); // Geräte ohne eigene Auswahl: Zuordnung aus dem vorhandenen Namen
  renderDevices();
  // Basis-Topics und Z2M-Oberflächen kommen nach: danach die Knöpfe „ⓘ Z2M“ neu zeichnen (nicht mitten in einer Eingabe)
  Promise.all([detectBases(), api.z2mUis().then(u => { S.z2mUis = Array.isArray(u) ? u : []; }).catch(() => {})]).then(([n]) => {
    if (n) toast(n + " Z2M-Basis-Topic(s) erkannt");
    const a = document.activeElement, tab = document.querySelector("main section:not([hidden])");
    if (!S.editing && (!a || a === document.body || !tab?.contains(a))) ({"tab-devices": renderDevices, "tab-gateways": renderGateways, "tab-network": renderNetwork})[tab?.id]?.();
  });
})();
</script>
</body>
