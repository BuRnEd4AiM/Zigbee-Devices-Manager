<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Zigbee Devices Manager</title>
<style>
:root{--bg:#f5f6f8;--card:#fff;--fg:#1d2330;--muted:#6b7385;--line:#e2e5ec;--accent:#0b7bd6;--accent-fg:#fff;--ok:#1a8f4c;--warn:#b86e00;--new:#c2410c;--chip:#eef2f8;--input:#fff;--q-good:#1a8f4c;--q-ok:#9a7b00;--q-weak:#d0650d;--q-bad:#c62828}
@media(prefers-color-scheme:dark){:root{--bg:#14171d;--card:#1c2028;--fg:#e6e9ef;--muted:#8d95a8;--line:#2d3340;--accent:#4aa3f0;--accent-fg:#06131f;--ok:#4cc27e;--warn:#e0a040;--new:#f08a4b;--chip:#262c38;--input:#14171d;--q-good:#4cc27e;--q-ok:#e2c044;--q-weak:#f0904b;--q-bad:#f26d6d}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}
header h1{font-size:17px;margin:0;font-weight:600}
nav{display:flex;gap:4px;margin-left:auto}
nav button{background:none;border:0;color:var(--muted);padding:6px 12px;border-radius:6px;cursor:pointer;font:inherit}
nav button.on{background:var(--chip);color:var(--fg);font-weight:600}
main{padding:16px;width:100%}
.banner{background:var(--chip);border:1px solid var(--line);border-left:4px solid var(--warn);padding:8px 12px;border-radius:6px;margin-bottom:12px;color:var(--muted)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
input,select,button{font:inherit;color:var(--fg)}
input,select{background:var(--input);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0}
input:focus,select:focus{outline:2px solid var(--accent);outline-offset:-1px}
.pick{flex:1;min-width:0}.pick input{width:100%}
.pickres{margin-top:4px;border:1px solid var(--line);border-radius:6px;max-height:240px;overflow:auto;background:var(--card)}
.pickres button{display:block;width:100%;text-align:left;background:none;border:0;border-bottom:1px solid var(--line);padding:6px 8px;cursor:pointer}
.pickres button:hover,.pickres button.on{background:var(--chip)}.pickres .sub{display:block;padding:6px 8px}
select.facet.on{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--input))}
button.btn{background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 12px;cursor:pointer}
button.btn:hover{border-color:var(--accent)}
button.primary{background:var(--accent);color:var(--accent-fg);border-color:var(--accent);font-weight:600}
button.danger{background:var(--q-bad);color:#fff;border-color:var(--q-bad);font-weight:600}
button:disabled{opacity:.45;cursor:default}
.chips{display:flex;gap:4px}
.chips button{background:var(--chip);border:0;border-radius:999px;padding:4px 12px;cursor:pointer;color:var(--muted)}
.chips button.on{background:var(--accent);color:var(--accent-fg)}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:auto}
table{border-collapse:collapse;width:100%}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:12px;color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--card)}
tr:last-child td{border-bottom:0}
td.name{cursor:text;font-weight:600;min-width:150px;word-break:break-word}
#tab-devices table{table-layout:auto;width:100%}
#tab-devices td select{width:100%;min-width:125px;max-width:100%}
#tab-devices td code{word-break:break-all}
.card{overflow-x:auto}
td.name:hover{text-decoration:underline dotted}
td.name input{width:100%;font-weight:600}
.sub{color:var(--muted);font-size:12px;font-weight:400}
code{font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12px}
.badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--chip);color:var(--muted)}
.badge.new{background:color-mix(in srgb,var(--new) 18%,transparent);color:var(--new)}
.badge.ok{color:var(--ok)}.badge.plan{color:var(--accent)}
.sugg{color:var(--ok);font-weight:600;font-family:ui-monospace,Menlo,Consolas,monospace}
.empty{padding:32px;text-align:center;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.panel h2{margin:0 0 10px;font-size:15px}
.row{display:flex;gap:8px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.row label{min-width:110px;color:var(--muted)}
.list .row input:first-child{flex:1}.list .row input.abbr{width:80px;flex:none;font-family:ui-monospace,monospace}
.preview{background:var(--chip);border-radius:6px;padding:10px;font-family:ui-monospace,monospace;line-height:1.8}
.tok{cursor:pointer;background:var(--chip);border:1px solid var(--line);border-radius:6px;padding:2px 8px;font-family:ui-monospace,monospace;font-size:12px}
.x{background:none;border:0;color:var(--muted);cursor:pointer;font-size:16px}
.links{display:flex;gap:4px}
.lnk{display:inline-block;font-size:12px;padding:2px 8px;border:1px solid var(--line);border-radius:6px;background:var(--card);color:var(--fg);text-decoration:none;white-space:nowrap;cursor:pointer}
.lnk:hover{border-color:var(--accent);color:var(--accent)}
.lnk.off{opacity:.45}
/* Reiter „Netzwerk“ */
.netwrap{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:16px;align-items:start}
.nettree{padding:6px 4px;max-height:calc(100vh - 210px);overflow:auto}
.netdetail{position:sticky;top:72px;max-height:calc(100vh - 210px);overflow:auto}
@media(max-width:950px){.netwrap{grid-template-columns:1fr}.nettree,.netdetail{max-height:none;position:static}}
.tn{display:flex;align-items:center;gap:6px;padding:3px 6px;border-radius:6px;cursor:pointer;min-width:0}
.tn:hover{background:var(--chip)}.tn.sel{background:color-mix(in srgb,var(--accent) 16%,transparent)}
.tn .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.tn.router .nm,.tn.coord .nm{font-weight:600}
.tw{width:18px;flex:none;text-align:center;color:var(--muted);border:0;background:none;cursor:pointer;padding:0;font-size:12px}
.tsub{margin-left:14px;padding-left:8px;border-left:1px dashed var(--line)}
.ty{flex:none;font-size:10px;font-weight:600;padding:1px 6px;border-radius:4px;background:var(--chip);color:var(--muted);letter-spacing:.02em}
.ty.coord{background:var(--accent);color:var(--accent-fg)}.ty.router{color:var(--fg)}
.q{flex:none;font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;white-space:nowrap;font-variant-numeric:tabular-nums;border:1px solid currentColor}
.q.good{color:var(--q-good)}.q.ok{color:var(--q-ok)}.q.weak{color:var(--q-weak)}.q.bad{color:var(--q-bad)}.q.none{color:var(--muted)}
.alt{flex:none;font-size:11px;color:var(--muted);border:0;background:none;cursor:pointer;padding:0 2px}
.alt:hover{color:var(--accent)}
.altlist{margin:0 0 4px 30px;padding:4px 8px;border-left:2px solid var(--chip);font-size:12px;color:var(--muted)}
.altlist div{display:flex;gap:6px;align-items:center;padding:1px 0}
.grp{display:flex;align-items:center;gap:6px;padding:8px 6px 4px;font-weight:600;color:var(--muted);cursor:pointer}
.kv{display:grid;grid-template-columns:120px minmax(0,1fr);gap:4px 10px;font-size:13px;margin:8px 0}
.kv span:nth-child(odd){color:var(--muted)}
.nbt td{padding:4px 6px;font-size:12px}.nbt tr{cursor:pointer}.nbt tr:hover td{background:var(--chip)}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}
.toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:8px 16px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
.toast.show{opacity:1}
@media(max-width:1250px){.hide-m{display:none}}
@media(max-width:1050px){.hide-l{display:none}}
@media(max-width:700px){.hide-s{display:none}}
@media(max-width:600px){nav{margin-left:0;flex-wrap:wrap}nav button{padding:6px 9px}}
</style>
</head>
<body>
<header>
  <h1>🐝 Zigbee Devices Manager</h1>
  <nav>
    <button data-tab="devices" class="on">Geräte</button>
    <button data-tab="gateways">Gateways</button>
    <button data-tab="network">Netzwerk</button>
    <button data-tab="scheme">Namensschema</button>
    <button data-tab="export">Export</button>
  </nav>
</header>
<main>
  <div id="banner"></div>
  <section id="tab-devices"></section>
  <section id="tab-gateways" hidden></section>
  <section id="tab-network" hidden></section>
  <section id="tab-scheme" hidden></section>
  <section id="tab-export" hidden></section>
</main>
<div class="toast" id="toast"></div>

<script src="zigbee-tree.js?v=0.16.0"></script>
<script>
// ---------- Konfiguration / Standarddaten ----------
const DEMO_FORCED = window.ZDM_DEMO === true;

const DEFAULT_SCHEME = {
  pattern: "{room}_{type}_{nr}",
  case: "upper",
  counter: {style: "arabic", pad: 2, start: 1},
  houses: [{id: "h1", name: "Haus H", abbr: "H"}, {id: "h2", name: "Haus S", abbr: "S"}],
  defaultHouse: "h1",
  floors: [{id: "f0", name: "Erdgeschoss", abbr: "0"}, {id: "f1", name: "1. Etage", abbr: "1"}, {id: "f2", name: "2. Etage", abbr: "2"}, {id: "f3", name: "3. Etage", abbr: "3"}],
  rooms: [
    {id: "r1", name: "Wohnzimmer", abbr: "WZ"}, {id: "r2", name: "Küche", abbr: "KU"},
    {id: "r3", name: "Schlafzimmer", abbr: "SZ"}, {id: "r4", name: "Bad", abbr: "BD"},
    {id: "r5", name: "Flur", abbr: "FL"}, {id: "r6", name: "Büro", abbr: "BU"},
    {id: "r7", name: "Garten", abbr: "GA"}
  ],
  types: [
    {id: "t1", name: "Lampe", abbr: "LP"}, {id: "t2", name: "Steckdose", abbr: "ST"},
    {id: "t3", name: "Temperatursensor", abbr: "TS"}, {id: "t4", name: "Bewegungsmelder", abbr: "BM"},
    {id: "t5", name: "Fenster-/Türkontakt", abbr: "FK"}, {id: "t6", name: "Taster", abbr: "TA"},
    {id: "t7", name: "Rollo", abbr: "RO"}, {id: "t8", name: "Heizkörperthermostat", abbr: "HT"}
  ]
};

const DEMO_FLOORS = [{id: "fl_eg", name: "Erdgeschoss", level: 0}, {id: "fl_og", name: "Obergeschoss", level: 1}, {id: "fl_ug", name: "Untergeschoss", level: -1}];
const DEMO_AREAS = [["Wohnzimmer", "fl_eg"], ["Küche", "fl_eg"], ["Flur", "fl_eg"], ["Schlafzimmer", "fl_og"], ["Bad", "fl_og"], ["Büro", "fl_og"], ["Terrasse", "fl_eg"], ["Keller", "fl_ug"]].map(([n, f]) => ({id: "area_" + n.toLowerCase().replace("ü", "ue"), name: n, floor_id: f}));
const DEMO_BRIDGES = [{id: "b1", source: "z2m", name: "Zigbee2MQTT Bridge (Haus 1)", config_url: "http://192.168.1.20:8080/#/settings"}, {id: "b2", source: "z2m", name: "Zigbee2MQTT Bridge (Haus 2)"}, {id: "matter", source: "matter", name: "Matter"}];
const DEMO_UIS = [{slug: "45df7312_zigbee2mqtt", name: "Zigbee2MQTT", url: "/api/hassio_ingress/demo-z2m-1/", state: "started"}, {slug: "45df7312_zigbee2mqtt_edge", name: "Zigbee2MQTT Edge", url: "/api/hassio_ingress/demo-z2m-2/", state: "started"}];
const DEMO_DEVICES = [
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0001", "Wohnzimmer", "Wohnzimmer Stehlampe"],
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0002", "Wohnzimmer", "WZ_LP_05"],
  ["TRÅDFRI bulb E27 WS opal 1055lm", "IKEA of Sweden", "LED1545G12", "0x680ae2fffe1a0003", "Wohnzimmer", null],
  ["Hue white ambiance", "Signify Netherlands B.V.", "LTW013", "0x001788010a1b2c03", "Küche", "KU_LP_01"],
  ["lumi.weather", "LUMI", "WSDCGQ11LM", "0x00158d0001a2b3c4", "Schlafzimmer", null],
  ["lumi.weather", "LUMI", "WSDCGQ11LM", "0x00158d0001a2b3c5", "", null],
  ["lumi.sensor_motion.aq2", "LUMI", "RTCGQ11LM", "0x00158d0002c4d5e6", "Flur", null],
  ["lumi.sensor_magnet.aq2", "LUMI", "MCCGQ11LM", "0x00158d0003d5e6f7", "Bad", null],
  ["lumi.sensor_magnet.aq2", "LUMI", "MCCGQ11LM", "0x00158d0003d5e6f8", "", null],
  ["TS011F", "_TZ3000_g5xawfcq", "TS011F_plug_1", "0xa4c138aabbcc0001", "Büro", "Büro Steckdose Monitor"],
  ["TS011F", "_TZ3000_g5xawfcq", "TS011F_plug_1", "0xa4c138aabbcc0002", "", null],
  ["TRV001", "Eurotronic", "SPZB0001", "0x00124b0022ee0001", "Büro", null],
  ["TRADFRI remote control", "IKEA of Sweden", "E1524", "0x680ae2fffe1a0010", "Wohnzimmer", null],
  ["Zigbee Coordinator", "Texas Instruments", "CC2652P", "0x00124b0030aa0000", "", "Koordinator"]
].map((d, i) => ({id: "demo" + i, source: "z2m", bridge: i < 8 ? "b1" : "b2", orig_name: d[0], manufacturer: d[1], model: d[2], ieee: d[3], area: d[4],
  is_new: !d[5], name: d[5] || d[3], area_id: d[4] ? "area_" + d[4].toLowerCase().replace("ü", "ue") : "", config_url: i < 8 ? "http://192.168.1.20:8080/#/device/0/" + d[3] + "/info" : ""}));
// Matter-Geräte (über Thread oder WLAN): gemeinsames Gateway „Matter“, Kennung ist die Node-ID (hinter einer Matter-Bridge mit Endpunkt)
const DEMO_MATTER = [
  ["Eve Energy", "Eve Systems", "Eve Energy 20EBO8301", 3, null, "Küche", null],
  ["Nanoleaf Essentials A19", "Nanoleaf", "NL67", 4, null, "Wohnzimmer", "WZ_LP_02"],
  ["Eve Door & Window", "Eve Systems", "Eve Door & Window 20EBN9901", 5, null, "Flur", null],
  ["Eve Thermo", "Eve Systems", "Eve Thermo 20EBP1701", 6, null, "Schlafzimmer", null],
  ["Aqara Motion and Light Sensor P2", "Aqara", "MS-S02", 7, null, "", null],
  ["Hue color lamp", "Signify Netherlands B.V.", "LCA001", 8, 11, "Büro", null]
].map((d, i) => ({id: "demoM" + i, source: "matter", bridge: "matter", orig_name: d[0], manufacturer: d[1], model: d[2], ieee: "", node: d[3], endpoint: d[4], area: d[5],
  is_new: !d[6], name: d[6] || d[0], area_id: d[5] ? "area_" + d[5].toLowerCase().replace("ü", "ue") : "", config_url: ""}));
// Doppelt: neben sensor.wz_lp_05_linkquality hängt noch die verwaiste Entität vom früheren Namen „Wohnzimmer Stehlampe“
DEMO_DEVICES[1].dup_ids = [{old: "sensor.wohnzimmer_stehlampe_linkquality_2", new: "sensor.wz_lp_05_linkquality"}];
// Benannt, aber die Entity-IDs tragen noch den Namen vom Anlernen – mit Bereich davor, wie Home Assistant neue IDs anlegt
DEMO_MATTER[1].stale_ids = [{old: "button.wohnzimmer_nanoleaf_essentials_a19_identify", new: "button.wz_lp_02_identify"}, {old: "light.wohnzimmer_nanoleaf_essentials_a19", new: "light.wz_lp_02"}];

// ---------- Hilfsfunktionen ----------
const $ = (s, el = document) => el.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const uid = p => p + Math.random().toString(36).slice(2, 8);
const clone = o => JSON.parse(JSON.stringify(o));
const SOURCE_NAMES = {zha: "ZHA", z2m: "Zigbee2MQTT", matter: "Matter"};

function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2400);
}
function download(name, text, type) {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type})); a.download = name; a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// ---------- Namens-Generator ----------
function toRoman(n) {
  const m = [[1000, "M"], [900, "CM"], [500, "D"], [400, "CD"], [100, "C"], [90, "XC"], [50, "L"], [40, "XL"], [10, "X"], [9, "IX"], [5, "V"], [4, "IV"], [1, "I"]];
  let r = ""; for (const [v, s] of m) while (n >= v) { r += s; n -= v; } return r;
}
function toAlpha(n) { let r = ""; while (n > 0) { n--; r = String.fromCharCode(65 + n % 26) + r; n = Math.floor(n / 26); } return r; }
function fmtNr(n, c) {
  if (c.style === "roman") return toRoman(n);
  if (c.style === "alpha") return toAlpha(n);
  return String(n).padStart(c.pad, "0");
}
function applyCase(s, mode) { return mode === "upper" ? s.toUpperCase() : mode === "lower" ? s.toLowerCase() : s; }
function buildName(scheme, room, type, n, house, floor) {
  const s = scheme.pattern
    .replaceAll("{house}", house?.abbr ?? "").replaceAll("{floor}", floor?.abbr ?? "").replaceAll("{room}", room?.abbr ?? "").replaceAll("{type}", type?.abbr ?? "")
    .replaceAll("{nr}", fmtNr(n, scheme.counter));
  return applyCase(s, scheme.case);
}
/** Nächste freie Nummer für Haus+Raum+Typ, berücksichtigt bereits belegte Namen. */
function nextName(scheme, room, type, used, house, floor) {
  for (let n = scheme.counter.start; n < 10000; n++) {
    const name = buildName(scheme, room, type, n, house, floor);
    if (!used.has(name.toLowerCase())) return name;
  }
}

// ---------- API (Add-on oder Demo) ----------
const api = {
  demo: DEMO_FORCED,
  async load() {
    if (!this.demo) {
      let r;
      try { r = await fetch("api/state"); }
      catch (e) { this.demo = true; }            // z. B. Datei lokal geöffnet: Demo
      if (r && r.status === 404) this.demo = true; // statischer Host ohne Add-on-Server: Demo
      else if (r) {
        if (!r.ok) { this.error = `HTTP ${r.status}: ${(await r.text()).slice(0, 400)}`; return {devices: [], store: {}, bridges: []}; }
        try { return await r.json(); } catch (e) { this.error = "Unerwartete Antwort vom Add-on-Server: " + e.message; return {devices: [], store: {}, bridges: []}; }
      }
    }
    let store = {};
    try { store = JSON.parse(localStorage.getItem("zdm-demo-store") || "{}"); } catch (e) {}
    let devices = clone([...DEMO_DEVICES, ...DEMO_MATTER]);
    try { const n = JSON.parse(localStorage.getItem("zdm-demo-names") || "{}"); devices.forEach(d => { if (n[d.id]) { d.name = n[d.id]; d.is_new = false; } }); } catch (e) {}
    try { const gone = JSON.parse(localStorage.getItem("zdm-demo-deleted") || "[]"); devices = devices.filter(d => !gone.includes(d.id)); } catch (e) {}
    try { const fixed = JSON.parse(localStorage.getItem("zdm-demo-ids") || "[]"); devices.forEach(d => { if (fixed.includes(d.id)) d.stale_ids = []; }); } catch (e) {}
    try { const gone = JSON.parse(localStorage.getItem("zdm-demo-dups") || "[]"); devices.forEach(d => { if (d.dup_ids) d.dup_ids = d.dup_ids.filter(c => !gone.includes(c.old)); }); } catch (e) {}
    return {devices, store, bridges: DEMO_BRIDGES, areas: DEMO_AREAS, floors: DEMO_FLOORS};
  },
  async saveStore(store) {
    if (this.demo) { try { localStorage.setItem("zdm-demo-store", JSON.stringify(store)); } catch (e) {} return; }
    const r = await fetch("api/store", {method: "PUT", body: JSON.stringify(store)});
    if (!r.ok) throw new Error(await r.text());
  },
  payload(list, forceArea = false) {
    return list.map(([d, name]) => ({device_id: d.id, name, old_name: d.name, orig_name: d.orig_name, source: d.source, ieee: d.ieee, base_topic: gwOf(d).topic || "",
      ...((S.setArea || forceArea) && roomOf(d) ? {area_id: roomOf(d).area_id || "", area_name: roomOf(d).name, current_area_id: d.area_id || "", current_area: d.area || ""} : {})}));
  },
  opts() { const on = S.renameEntities; return {set_area: S.setArea, rename_z2m: S.renameZ2m, rename_entities: on, update_references: on && S.updateRefs, update_yaml: on && S.updateYaml, update_nodered: on && S.updateNodered}; },
  async post(path, body) {
    const r = await fetch(path, {method: "POST", body: JSON.stringify(body)});
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },
  async plan(list, extra = {}) {
    if (this.demo) {
      if (extra.entities_only) {
        const entities = list.flatMap(([d]) => (d.stale_ids || []).filter(c => !c.reason));
        return {entities, skipped: list.flatMap(([d]) => (d.stale_ids || []).filter(c => c.reason)), usages: [], unreadable: 0, notes: [], areas: [],
          unhandled: S.updateRefs ? [] : [{kind: "dashboard", title: "Licht", entities: entities.map(e => e.old)}]};
      }

// ---------- State ----------
const S = {devices: [], scheme: clone(DEFAULT_SCHEME), meta: {}, planned: [], filter: "all", q: "", sel: new Set(), areas: [], haFloors: [], z2mBases: [], z2mUis: [], bridges: [], gateways: {}, gwFilter: "", facets: {}, permitUntil: {}, permitReal: {}, editing: null, storeLoaded: false, renameZ2m: true, renameEntities: true, setArea: true, updateRefs: true, updateYaml: false, updateNodered: false, deleteForce: true};
/** Haken beim Umbenennen und Löschen – werden im Store gemerkt. */
const OPTION_KEYS = ["setArea", "renameZ2m", "renameEntities", "updateRefs", "updateYaml", "updateNodered", "deleteForce"];

const storeData = () => ({scheme: S.scheme, meta: S.meta, planned: S.planned, gateways: S.gateways, options: Object.fromEntries(OPTION_KEYS.map(k => [k, S[k]])), optionsRev: 2, network: S.network});
function persist() {
  // Konnten die gespeicherten Einstellungen nicht geladen werden (HA nicht erreichbar), würde Speichern sie mit Standardwerten überschreiben
  if (!S.storeLoaded) return;
  clearTimeout(persist.t);
  persist.t = setTimeout(() => api.saveStore(storeData()).catch(e => toast("Speichern fehlgeschlagen: " + e.message)), 300);
}
const allRows = () => [...S.devices, ...S.planned.map(p => ({id: p.id, name: p.name, orig_name: "", manufacturer: "", model: "", ieee: "", area: "", is_new: false, planned: true}))];
/** Raum: eigene Auswahl, sonst Raum des HA-Bereichs – aber nur, wenn er zu Haus/Etage des Geräts passt (z. B. kein „Bad (H1)“ für ein S2-Gerät). */
const roomOf = d => {
  const rooms = S.scheme.rooms, picked = rooms.find(r => r.id === S.meta[d.id]?.room);
  if (picked) return picked;
  const code = devCode(d);
  const ok = r => !code || !roomCodes(r).length || roomCodes(r).includes(code);
  return [rooms.find(r => d.area_id && r.area_id === d.area_id), rooms.find(r => d.area && r.name.toLowerCase() === d.area.toLowerCase())].find(r => r && ok(r));
};
/** Haus+Etage-Code des Geräts (z. B. „s2“) aus Auswahl oder Namen; null, wenn Haus oder Etage unbekannt. */
function devCode(d) {
  if (!useHouse() || !useFloor()) return null;
  const p = parseNameLoose(d.name) || {}, sc = S.scheme;
  const house = sc.houses.find(h => h.id === (S.meta[d.id]?.house || p.house)), floor = sc.floors.find(f => f.id === (S.meta[d.id]?.floor || p.floor));
  return house && floor ? (house.abbr + floor.abbr).toLowerCase() : null;
}
/** Haus+Etage-Codes, die im Raum-/Bereichsnamen stehen, z. B. „Gang (H1)“ → ["h1"]. */
function roomCodes(room) {
  if (!useHouse() || !useFloor()) return [];
  const name = room.name.toLowerCase(), sc = S.scheme;
  return sc.houses.flatMap(h => sc.floors.map(f => (h.abbr + f.abbr).toLowerCase())).filter(c => new RegExp("(^|[^a-z0-9])" + c.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + "($|[^a-z0-9])").test(name));
}

/** Kürzel für einen neuen Raum: erste Buchstaben des Namens, eindeutig unter den vorhandenen Räumen. */
function makeAbbr(name, rooms) {
  const letters = name.normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^A-Za-z0-9]/g, "");
  const taken = new Set(rooms.map(r => r.abbr.toLowerCase()));
  for (let n = 2; n <= letters.length; n++) { const a = letters.slice(0, n).toUpperCase(); if (!taken.has(a.toLowerCase())) return a; }
  let i = 2; while (taken.has((letters.slice(0, 2) + i).toLowerCase())) i++;
  return letters.slice(0, 2).toUpperCase() + i;
}
/** Übernimmt Etagen aus Home Assistant (Kürzel: H<Ebene>, negative Ebenen U<n>). Verknüpft gleichnamige vorhandene Etagen. */
function syncFloors() {
  const sc = S.scheme; sc.ignoredFloors = sc.ignoredFloors || []; let changed = false;
  for (const f of S.haFloors) {
    if (sc.floors.some(x => x.floor_id === f.id) || sc.ignoredFloors.includes(f.id)) continue;
    const same = sc.floors.find(x => !x.floor_id && x.name.toLowerCase() === f.name.toLowerCase());
    if (same) { same.floor_id = f.id; changed = true; continue; }
    const lvl = Number.isInteger(f.level) ? f.level : null;
    let abbr = lvl === null ? makeAbbr(f.name, sc.floors) : lvl >= 0 ? String(lvl) : "U" + -lvl;
    const alt = lvl !== null && lvl >= 0 ? ["H" + lvl] : []; // ältere Kürzel (H1) erkennen
    const byAbbr = sc.floors.find(x => !x.floor_id && [abbr, ...alt].some(a => x.abbr.toLowerCase() === a.toLowerCase())); // z. B. Ebene 1 ↔ vorhandene Etage 1
    if (byAbbr) { byAbbr.floor_id = f.id; changed = true; continue; }
    while (sc.floors.some(x => x.abbr.toLowerCase() === abbr.toLowerCase())) abbr += "x";
    sc.floors.push({id: uid("f"), name: f.name, abbr, floor_id: f.id}); changed = true;
  }
  if (changed) persist();
}
/** Übernimmt Bereiche aus Home Assistant als Räume (verknüpft vorhandene gleichnamige, legt fehlende an). Gibt die Zahl neuer Räume zurück. */
function syncAreas() {
  const sc = S.scheme; sc.ignoredAreas = sc.ignoredAreas || []; let added = 0, changed = false;
  for (const a of S.areas) {
    if (sc.rooms.some(r => r.area_id === a.id) || sc.ignoredAreas.includes(a.id)) continue;
    const same = sc.rooms.find(r => !r.area_id && r.name.toLowerCase() === a.name.toLowerCase());
    if (same) { same.area_id = a.id; changed = true; continue; }
    sc.rooms.push({id: uid("r"), name: a.name, abbr: makeAbbr(a.name, sc.rooms), area_id: a.id}); added++;
  }
  if (added || changed) persist();
  return added;
}
const typeOf = d => S.scheme.types.find(t => t.id === S.meta[d.id]?.type);
/** Räume und Gerätetypen alphabetisch nach Namen („Bad 2“ vor „Bad 10“), bei gleichem Namen nach Kürzel – nur für die Anzeige,
 *  gespeichert bleibt die Reihenfolge. */
const byName = items => [...items].sort((a, b) => (a.name || "").localeCompare(b.name || "", "de", {numeric: true, sensitivity: "base"})
  || (a.abbr || "").localeCompare(b.abbr || "", "de", {numeric: true}));
const gwOf = d => S.gateways[d.bridge] || {};
/** Kennung des Geräts: IEEE bei Zigbee, Node-ID (hinter einer Matter-Bridge mit Endpunkt) bei Matter. */
const addrOf = d => d.source !== "matter" ? d.ieee || "" : d.node == null ? "" : "Node " + d.node + (d.endpoint == null ? "" : " · Endpunkt " + d.endpoint);
/** Benanntes Gerät, dessen Entity-IDs noch nicht zum Namen passen (z. B. light.wohnzimmer_s2_wzel03 bei S2-WZEL-LSP03). */
const staleIds = d => !d.planned && !d.is_new ? d.stale_ids || [] : [];
/** Entitäten, deren neue ID es schon gibt (doppelt, meist eine Altlast vom früheren Namen) – Angleichen kann sie nicht auflösen. */
const dupIds = d => !d.planned && !d.is_new ? d.dup_ids || [] : [];
const houseOf = d => S.scheme.houses.find(h => h.id === (S.meta[d.id]?.house || gwOf(d).house || S.scheme.defaultHouse));
const useHouse = () => S.scheme.pattern.includes("{house}");
const useFloor = () => S.scheme.pattern.includes("{floor}");
/** Etage: Auswahl am Gerät, sonst die Etage des Raums (HA-Bereich → HA-Etage), sonst Standard. */
const floorOf = d => {
  const sc = S.scheme, picked = sc.floors.find(f => f.id === S.meta[d.id]?.floor);
  if (picked) return picked;
  const room = roomOf(d), area = S.areas.find(a => a.id === (room?.area_id || d.area_id));
  return sc.floors.find(f => area?.floor_id && f.floor_id === area.floor_id) || sc.floors.find(f => f.id === sc.defaultFloor);
};

/** Filter der Geräteliste nach Haus, Etage, Raum und Typ – so, wie sie in der Zeile gewählt bzw. abgeleitet sind. Wert "-" = ohne. */
const FACETS = [
  {key: "house", label: "Haus", none: "ohne Haus", of: d => houseOf(d)?.id, list: () => S.scheme.houses, on: () => useHouse() && S.scheme.houses.length > 1},

/** Zigbee2MQTT-Instanz (aus bridge/info) eines Gateways: über die Koordinator-IEEE, sonst über den Basis-Topic. */
function z2mInfoOf(bridgeId) {
  const b = S.bridges.find(x => x.id === bridgeId), topic = S.gateways[bridgeId]?.topic;
  return S.z2mBases.find(f => f.ieee && b?.ieee && f.ieee.toLowerCase() === b.ieee.toLowerCase()) || S.z2mBases.find(f => topic && f.base_topic === topic);
}
/** Adresse der Z2M-Oberfläche eines Gateways: eigene Eingabe, frontend.url aus Z2M, Link am Bridge-Gerät in HA oder das einzige Z2M-Add-on. */
function z2mUiOf(bridgeId) {
  const own = S.gateways[bridgeId]?.ui;
  if (own) return {url: own, how: "eigene Adresse"};
  const fe = z2mInfoOf(bridgeId)?.frontend?.url;
  if (fe) return {url: fe, how: "frontend.url aus Zigbee2MQTT"};
  const cu = S.bridges.find(x => x.id === bridgeId)?.config_url;
  if (cu) return {url: cu.split("#")[0], how: "Link am Bridge-Gerät in HA"};
  if (S.z2mUis.length === 1 && S.bridges.filter(b => b.source === "z2m").length === 1) return {url: S.z2mUis[0].url, how: "Add-on „" + S.z2mUis[0].name + "“"};
  return null;
}
/** Link zur Info-Seite des Geräts in der Zigbee2MQTT-Oberfläche ("" wenn unbekannt). */
function z2mLink(d) {
  if (d.source !== "z2m" || !d.ieee) return "";
  if (d.config_url) return d.config_url; // setzt Z2M selbst, wenn dort frontend.url eingetragen ist
  const ui = z2mUiOf(d.bridge), info = z2mInfoOf(d.bridge);
  if (!ui) return "";
  // windfront (Standard in Z2M 2.x) zählt Instanzen mit: #/device/0/<ieee>; die alte Oberfläche nicht. Unbekannt: windfront
  const legacy = info && (info.frontend?.package || "zigbee2mqtt-frontend") === "zigbee2mqtt-frontend";
  return ui.url.split("#")[0].replace(/\/+$/, "") + "/#/device/" + (legacy ? "" : "0/") + d.ieee + "/info";
}
const haDevicePath = d => "/config/devices/device/" + encodeURIComponent(d.id);
/** Wechselt in Home Assistant zur Seite path – das Add-on läuft im iframe von HA. Strg-/Mittelklick öffnet wie gewohnt einen neuen Tab. */
function haNavigate(e, path) {
  if (e.ctrlKey || e.metaKey || e.shiftKey || e.button === 1) return;
  e.preventDefault();
  if (api.demo) { toast("Demo: öffnet in Home Assistant " + path); return; }
  if (window.parent === window) { location.assign(path); return; }
  window.parent.postMessage({type: "home-assistant/navigate", path}, "*");
  // Ältere HA-Versionen kennen die Nachricht nicht – dann die ganze Seite wechseln
  setTimeout(() => { try { if (window.top.location.pathname !== path) window.top.location.assign(path); } catch (err) { window.open(path, "_top"); } }, 700);
}
function openZ2m(e, url) {
  if (url.startsWith("homeassistant://")) return haNavigate(e, "/" + url.slice("homeassistant://".length).replace(/^\/+/, ""));
  if (api.demo) { e.preventDefault(); toast("Demo: öffnet die Zigbee2MQTT-Seite " + url); }
}
/** Knöpfe „ⓘ Z2M“ (Geräteseite in der Zigbee2MQTT-Oberfläche) und „⌂ HA“ (Geräteseite in Home Assistant). */
function openLinks(d) {
  if (d.planned) return "";

  if (d.source === "z2m") {
    const url = z2mLink(d);
    out += url ? `<a class="lnk z2m" href="${esc(url)}" target="_blank" rel="noopener" title="Gerät in Zigbee2MQTT öffnen: Info, MQTT-Topic, Exposes, Einstellungen">ⓘ Z2M</a>`
      : `<span class="lnk off" title="Adresse der Zigbee2MQTT-Oberfläche unbekannt – im Tab „Gateways“ bei „Z2M-Oberfläche“ eintragen (Klick öffnet den Tab)">ⓘ Z2M</span>`;
  }
  return out + `<a class="lnk ha" href="${esc(haDevicePath(d))}" target="_top" title="Gerät in Home Assistant öffnen: Entitäten, Bereich, ${d.source === "matter" ? "Matter-Info (Netzwerk, Thread)" : "MQTT-Info"}">⌂ HA</a>`

}

/** Baut aus dem Namensmuster einen regulären Ausdruck mit den vorhandenen Kürzeln. */
function patternRegex(sc) {
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = items => items.map(i => i.abbr).filter(Boolean).sort((a, b) => b.length - a.length).map(esc).join("|");
  const nrRe = sc.counter.style === "roman" ? "[IVXLCDM]+" : sc.counter.style === "alpha" ? "[A-Z]+" : "\\d+";
  const lists = {house: sc.houses, floor: sc.floors, room: sc.rooms, type: sc.types};
  const keys = []; let src = "";
  for (const part of sc.pattern.split(/(\{(?:house|floor|room|type|nr)\})/)) {
    const m = /^\{(house|floor|room|type|nr)\}$/.exec(part);
    if (!m) { src += esc(part); continue; }
    const a = m[1] === "nr" ? nrRe : alt(lists[m[1]] || []);
    if (!a) return null;
    keys.push(m[1]); src += "(" + a + ")";
  }
  return {re: new RegExp("^" + src + "$", "i"), keys};
}
/** Raum zu einem Kürzel aus dem Namen. Teilen sich mehrere Räume das Kürzel (z. B. „Bad (H1)“ und „Bad (S2)“), zählt der Code von Haus+Etage;
 *  ein Raum mit anderem Code wird nie genommen. */
function resolveRoom(abbr, houseId, floorId) {
  const sc = S.scheme, h = sc.houses.find(x => x.id === houseId), f = sc.floors.find(x => x.id === floorId);
  const cands = sc.rooms.filter(r => r.abbr.toLowerCase() === abbr.toLowerCase());
  const code = useHouse() && useFloor() && h && f ? (h.abbr + f.abbr).toLowerCase() : null;
  if (!code) return cands[0]?.id;
  return (cands.find(r => roomCodes(r).includes(code)) || cands.find(r => !roomCodes(r).length))?.id;
}
/** Zerlegt einen vorhandenen Namen nach dem Muster: {house, floor, room, type, nr} (IDs bzw. Nummer) oder null. */
function parseName(name) {
  const pr = patternRegex(S.scheme); if (!pr) return null;
  const m = pr.re.exec((name || "").trim()); if (!m) return null;
  const sc = S.scheme, lists = {house: sc.houses, floor: sc.floors, room: sc.rooms, type: sc.types}, out = {};
  pr.keys.forEach((k, i) => { const v = m[i + 1]; if (k !== "room") out[k] = k === "nr" ? v : lists[k].find(x => x.abbr.toLowerCase() === v.toLowerCase())?.id; });
  const ri = pr.keys.indexOf("room"); if (ri >= 0) out.room = resolveRoom(m[ri + 1], out.house, out.floor);
  return out;
}
/** Erkennt auch Teile eines Namens: führende Bausteine (z. B. „S2“ = Haus+Etage), selbst wenn Raum oder Typ unbekannt sind. */
function parseNameLoose(name) {
  const sc = S.scheme, text = (name || "").trim();
  const esc = t => t.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
  const alt = items => items.map(i => i.abbr).filter(Boolean).sort((a, b) => b.length - a.length).map(esc).join("|");
  const nrRe = sc.counter.style === "roman" ? "[IVXLCDM]+" : sc.counter.style === "alpha" ? "[A-Z]+" : "\\d+";
  const lists = {house: sc.houses, floor: sc.floors, room: sc.rooms, type: sc.types};
  const parts = sc.pattern.split(/(\{(?:house|floor|room|type|nr)\})/).filter(x => x !== "");
  const total = parts.filter(x => /^\{/.test(x)).length;
  for (let k = total; k >= 1; k--) {
    let src = "", keys = [], end = 0;
    for (const part of parts) {
      const m = /^\{(house|floor|room|type|nr)\}$/.exec(part);
      if (!m) { src += esc(part); continue; }
      if (keys.length >= k) break;
      const a = m[1] === "nr" ? nrRe : alt(lists[m[1]] || []);
      if (!a) { keys = null; break; }
      keys.push(m[1]); src += "(" + a + ")"; end = src.length;
    }
    if (!keys) continue;
    const mm = new RegExp("^" + src.slice(0, end), "i").exec(text); if (!mm) continue;
    const out = {};
    keys.forEach((key, i) => { if (key !== "room") out[key] = key === "nr" ? mm[i + 1] : lists[key].find(x => x.abbr.toLowerCase() === mm[i + 1].toLowerCase())?.id; });
    const ri = keys.indexOf("room"); if (ri >= 0) out.room = resolveRoom(mm[ri + 1], out.house, out.floor);
    return out;
  }
  return null;
}
/** Ordnet Haus/Etage/Raum/Typ aus bereits vergebenen Namen zu. overwrite=false: nur Geräte ohne eigene Auswahl. */
function syncFromNames(overwrite) {
  let matched = 0, unmatched = 0;
  for (const d of S.devices) {
    const full = parseName(d.name), p = full || parseNameLoose(d.name); // Teilerkennung: z. B. nur „S2“ im Namen
    if (!full && !d.is_new) unmatched++;
    if (!p) continue;
    if (!overwrite && Object.keys(S.meta[d.id] || {}).length) { if (full) matched++; continue; }
    const m = {...S.meta[d.id]};
    for (const k of ["house", "floor", "room", "type"]) {
      if (!(k in p)) continue;
      if (p[k]) m[k] = p[k]; else if (overwrite) delete m[k]; // im Namen erkannt, aber kein passender Eintrag: alte Auswahl verwerfen
    }
    if (overwrite && m.room && m.house && m.floor) { // bisher gewählter Raum mit fremdem Haus/Etage-Code wird verworfen
      const h = S.scheme.houses.find(x => x.id === m.house), f = S.scheme.floors.find(x => x.id === m.floor), r = S.scheme.rooms.find(x => x.id === m.room);
      const code = h && f && useHouse() && useFloor() ? (h.abbr + f.abbr).toLowerCase() : null;
      if (code && r && roomCodes(r).length && !roomCodes(r).includes(code)) delete m.room;
    }
    S.meta[d.id] = m; if (full) matched++;
  }
  persist();
  return {matched, unmatched};
}

/** Berechnet Namensvorschläge für alle Zeilen mit Raum+Typ, die noch nicht dem Schema entsprechen. */
function suggestions() {
  const rows = allRows(), out = new Map();
  const pending = rows.filter(d => typeOf(d) && (!S.scheme.pattern.includes("{room}") || roomOf(d)) && (!useHouse() || houseOf(d)) && (!useFloor() || floorOf(d)));
  const pendIds = new Set(pending.map(d => d.id));
  const used = new Set(rows.filter(d => !pendIds.has(d.id)).map(d => d.name.toLowerCase()));
  // Passt der aktuelle Name schon zu Haus/Etage/Raum/Typ, bleibt er (samt Nummer) bestehen
  const fits = d => { const p = parseName(d.name); return p && (!("house" in p) || p.house === houseOf(d)?.id) && (!("floor" in p) || p.floor === floorOf(d)?.id)
    && (!("room" in p) || p.room === roomOf(d)?.id) && (!("type" in p) || p.type === typeOf(d)?.id); };
  const keep = pending.filter(fits);
  for (const d of keep) { out.set(d.id, d.name); used.add(d.name.toLowerCase()); }
  for (const d of pending.filter(d => !keep.includes(d))) {
    const room = roomOf(d), type = typeOf(d);
    const name = nextName(S.scheme, room, type, used, houseOf(d), floorOf(d));
    used.add(name.toLowerCase());
    out.set(d.id, name);
  }
  return out;
}

    const done = async save => {

  }
}

      <div class="preview" style="max-height:140px;overflow:auto">${plan.areas.map(a => `${esc(a.device)}: ${esc(a.from || "–")} → <b>${esc(a.to)}</b>${a.create ? ` <span class="sub">(wird neu angelegt)</span>` : ""}`).join("<br>")}</div>` : ""}

      <div class="preview" style="max-height:160px;overflow:auto">${plan.entities.map(e => `${esc(e.old)} → <b>${esc(e.new)}</b>`).join("<br>") || (plan.entity_info || []).map(i => {
        const list = (i.entities || []).map(esc).join(", ") + (i.count > (i.entities || []).length ? " …" : "");

      }).join("<br>") || "keine"}</div>` : ""}
      ${plan.skipped.length ? `<p class="sub">Übersprungen: ${plan.skipped.map(s => esc(s.old) + " (" + esc(s.reason) + ")").join(", ")}</p>` : ""}
      ${refs ? `<p class="sub" style="margin-top:12px">Verweise, die angepasst werden (${plan.usages.length}):</p>
      <div class="preview" style="max-height:160px;overflow:auto">${plan.usages.map(u => `${kinds[u.kind] || u.kind}: <b>${esc(u.title)}</b> <span class="sub">(${u.entities.length} Entität${u.entities.length == 1 ? "" : "en"})</span>`).join("<br>") || (plan.entities.length ? "keine gefunden" : "nichts zu ersetzen, weil sich keine Entity-ID ändert")}</div>
      ${plan.unreadable ? `<p class="sub">${plan.unreadable} Automationen/Szenen sind nicht über die Oberfläche lesbar (YAML) und werden <b>nicht</b> angepasst.</p>` : ""}

        <b>⚠ ${plan.unhandled.length} Automation(en)/Dashboard(s) verwenden diese Entity-IDs</b> und zeigen danach ins Leere, wenn sie nicht angepasst werden:

/** Zeigt einen Fortschrittsbalken, solange fn(progressId) läuft; fragt den Server nach dem Stand. */
async function runWithProgress(title, fn) {
  const pid = uid("p");
  const dlg = document.createElement("dialog");
  dlg.style.cssText = "max-width:520px;width:92%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
  dlg.innerHTML = `<h2 style="margin:0 0 12px;font-size:16px">${esc(title)}</h2>
    <div style="height:10px;background:var(--chip);border-radius:999px;overflow:hidden"><div id="pbar" style="height:100%;width:3%;background:var(--accent);border-radius:999px;transition:width .35s"></div></div>
    <p class="sub" id="plabel" style="margin:10px 0 0">Starte …</p><p class="sub" id="pperc" style="margin:2px 0 0"></p>`;
  dlg.oncancel = e => e.preventDefault();
  document.body.appendChild(dlg); dlg.showModal();
  let demoStep = 0;
  const set = (done, total, label) => { const pct = Math.max(3, Math.round(100 * done / total)); $("#pbar", dlg).style.width = pct + "%"; $("#plabel", dlg).textContent = label; $("#pperc", dlg).textContent = pct + " % – bitte warten, nicht schließen"; };
  const timer = setInterval(async () => {
    try {
      if (api.demo) { demoStep = Math.min(demoStep + 1, 5); set(demoStep, 6, ["Lese Entitäten …", "Benenne um …", "Entity-IDs …", "Suche Verweise …", "Prüfe das Ergebnis …"][Math.min(demoStep - 1, 4)]); return; }
      const j = await (await fetch("api/progress?id=" + pid)).json(); set(j.done, j.total, j.label);
    } catch (e) { /* Fortschritt ist nur Anzeige */ }
  }, 450);
  try { return await fn(pid); }
  finally { clearInterval(timer); set(1, 1, "Fertig"); dlg.close(); dlg.remove(); }
}

/** Erkennt die Zigbee2MQTT-Basis-Topics über MQTT und trägt sie bei den Gateways ein (nur wenn noch leer). Gibt die Zahl neuer Einträge zurück. */
async function detectBases() {
  if (api.demo) return 0;
  let found; try { found = await (await fetch("api/z2m_bases")).json(); } catch (e) { return 0; }
  if (!Array.isArray(found)) return 0;
  S.z2mBases = found; let n = 0;
  const z2m = S.bridges.filter(b => b.source === "z2m");
  for (const b of z2m) {
    const g = S.gateways[b.id] || (S.gateways[b.id] = {});
    if (g.topic) continue;
    const hit = found.find(f => f.ieee && b.ieee && f.ieee.toLowerCase() === b.ieee.toLowerCase()) || (found.length === 1 && z2m.length === 1 ? found[0] : null);
    if (hit) { g.topic = hit.base_topic; n++; }
  }
  if (n) persist();
  return n;
}

/** Liest Geräte, Bereiche und Etagen frisch aus Home Assistant, damit die Liste den echten Stand zeigt. */
async function refreshFromHA(quiet = false) {
  if (api.demo) return;
  try {
    const data = await api.load();
    if (api.error) { api.error = null; return; }
    S.devices = data.devices; S.bridges = data.bridges || S.bridges; S.areas = data.areas || S.areas; S.haFloors = data.floors || S.haFloors;
    if (!quiet) toast("Liste neu aus Home Assistant geladen");
  } catch (e) { if (!quiet) toast("Neu laden fehlgeschlagen: " + e.message); }
}

/** Bereich lokal nachziehen; neu angelegte Bereiche mit dem Raum verknüpfen. */
function adoptAreas(items) {
  for (const it of items || []) {
    const dev = S.devices.find(x => x.id === it.device_id); if (!dev || !it.area_id) continue;
    const room = roomOf(dev); dev.area_id = it.area_id; dev.area = room?.name || dev.area;
    if (room && !room.area_id) { room.area_id = it.area_id; S.areas.push({id: it.area_id, name: room.name, floor_id: ""}); }
  }
  persist();
}

/** Weist Geräte ihrem gewählten Raum als Bereich in Home Assistant zu – ohne Umbenennen. */
async function assignAreas(devs) {
  const list = devs.filter(d => !d.planned && roomOf(d)).map(d => [d, d.name]);
  if (!list.length) { toast("Kein Gerät mit gewähltem Raum"); return; }
  try {
    const plan = await api.planAreas(list);
    if (!plan.areas?.length) { toast("Alle gewählten Geräte sind schon im richtigen Bereich"); return; }
    if (!await confirmPlan(plan, plan.areas.length, "area")) return;
    const res = await api.assignAreas(list);
    adoptAreas(res.items);
    await refreshFromHA(true);
    await showChecks(res.checks || [], {items: res.items, renamed: [], opts: {set_area: true, skip_names: true}}, res.errors || []);
  } catch (e) { toast("Fehler: " + e.message); }
  renderDevices();
}

/** Zeigt das Prüfergebnis nach dem Umbenennen; „Erneut prüfen“ liest den aktuellen Stand neu. */
function showChecks(checks, last, errors) {
  return new Promise(resolve => {
    const icon = {ok: "✅", info: "ℹ️", warn: "⚠️", fail: "❌"};
    const dlg = document.createElement("dialog");
    dlg.style.cssText = "max-width:680px;width:92%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
    const draw = list => {
      const bad = list.some(c => c.status === "fail") || errors.length, warn = list.some(c => c.status === "warn");
      dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">${bad ? "❌ Prüfung: nicht alles hat geklappt" : warn ? "⚠️ Prüfung: bitte nachsehen" : "✅ Prüfung: alles wurde angepasst"}</h2>
        <div class="preview" style="line-height:1.6">${list.map(c => `${icon[c.status] || "•"} <b>${esc(c.name)}</b><div class="sub" style="margin:0 0 6px 24px">${esc(c.detail)}</div>`).join("") || "Keine Prüfung verfügbar."}
        ${errors.map(e => `❌ <b>${esc(e.device)}</b><div class="sub" style="margin:0 0 6px 24px">${esc(e.error)}</div>`).join("")}</div>
        <div class="row" style="justify-content:flex-end;margin:16px 0 0">${list.some(c => c.fix) ? `<button class="btn" id="fix" title="Ersetzt die alten Entity-IDs in Automationen, Skripten, Szenen und Dashboards durch die neuen (vorher gesichert)">Alte IDs jetzt ersetzen</button>` : ""}<button class="btn" id="re">Erneut prüfen</button><button class="btn primary" id="ok">Schließen</button></div>`;
      $("#ok", dlg).onclick = () => { dlg.close(); dlg.remove(); resolve(); };
      $("#fix", dlg) && ($("#fix", dlg).onclick = async () => {
        $("#fix", dlg).disabled = true; $("#fix", dlg).textContent = "Ersetze …";
        try {
          const r = await api.fixReferences(last), names = new Set(r.checks.map(c => c.name));
          errors = r.errors || [];
          toast(r.updated_references.length + " Automation(en)/Dashboard(s) angepasst");
          draw([...list.filter(c => !names.has(c.name)), ...r.checks]); // nur die neu geprüften Punkte ersetzen
        } catch (e) { toast("Ersetzen fehlgeschlagen: " + e.message); draw(list); }
      });
      $("#re", dlg).onclick = async () => {
        $("#re", dlg).disabled = true; $("#re", dlg).textContent = "Prüfe…";
        try { draw((await (last.recheck ? last.recheck() : api.verify(last))).checks); } catch (e) { toast("Prüfung fehlgeschlagen: " + e.message); draw(list); }
      };
    };
    draw(checks); document.body.appendChild(dlg); dlg.showModal(); dlg.oncancel = () => { dlg.remove(); resolve(); };
  });
}

/** Bestätigung zum Löschen: zeigt, was alles verschwindet, und gibt erst nach eingetipptem „LÖSCHEN“ frei. */
function confirmDelete(real, planned, plan) {
  return new Promise(resolve => {
    const info = new Map(plan.devices.map(x => [x.device_id, x])), has = src => real.some(d => d.source === src);
    const kinds = {automation: "Automation", script: "Skript", scene: "Szene", dashboard: "Dashboard"};

    const how = [
      has("z2m") && "<b>Zigbee2MQTT:</b> Das Gerät wird aus dem Zigbee-Netz abgemeldet und aus Z2M entfernt, danach aus Home Assistant.",
      has("zha") && "<b>ZHA:</b> Das Gerät wird aus dem Zigbee-Netz entfernt und aus Home Assistant gelöscht.",
      has("matter") && "<b>Matter:</b> Home Assistant entfernt das Gerät aus seinem Matter-Netz. Ist es zusätzlich in Apple Home, Google Home o. ä. eingebunden, bleibt es dort."
        + (real.some(d => d.source === "matter" && d.endpoint != null) ? " Geräte hinter einer Matter-Bridge in der Bridge selbst entfernen, sonst tauchen sie wieder auf." : "")
    ].filter(Boolean);
    const dlg = document.createElement("dialog");
    dlg.style.cssText = "max-width:640px;width:92%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">🗑 ${real.length + planned.length} Gerät(e) restlos löschen</h2>
      <div class="preview" style="max-height:170px;overflow:auto;line-height:1.6">${[...real.map(d => { const x = info.get(d.id) || {entities: [], children: []};
          return `<b>${esc(d.name)}</b> <span class="sub">${esc(SOURCE_NAMES[d.source] || "")} · ${x.entities.length} Entität${x.entities.length === 1 ? "" : "en"}</span>`
            + (x.blocked ? `<br><span style="color:var(--q-bad)">ZHA-Koordinator – wird nicht gelöscht</span>`
              : x.children.length ? `<br><span style="color:var(--new)">⚠ Daran hängen ${x.children.length} Gerät(e) (${esc(x.children.slice(0, 5).join(", "))}${x.children.length > 5 ? " …" : ""}) – sie verschwinden mit.</span>` : ""); }),
        ...planned.map(d => `<b>${esc(d.name)}</b> <span class="sub">geplant – wird nur aus der Liste entfernt</span>`)].join("<br>")}</div>
      ${how.map(h => `<p class="sub" style="margin:8px 0 0">${h}</p>`).join("")}
      ${ents.length ? `<p class="sub" style="margin-top:12px">Entitäten, die mit gelöscht werden (${ents.length}):</p><div class="preview" style="max-height:90px;overflow:auto">${ents.map(esc).join(", ")}</div>` : ""}
      ${plan.usages.length ? `<div class="banner" style="border-left-color:var(--new);margin:12px 0 0;color:var(--fg)"><b>⚠ ${plan.usages.length} Automation(en)/Dashboard(s) verwenden diese Entitäten</b> und zeigen danach ins Leere:
        <div class="sub" style="max-height:90px;overflow:auto;margin-top:4px">${plan.usages.map(u => `${kinds[u.kind] || u.kind}: <b>${esc(u.title)}</b> (${u.entities.map(esc).join(", ")})`).join("<br>")}</div></div>` : ""}
      ${plan.unreadable ? `<p class="sub">${plan.unreadable} Automationen/Szenen sind nicht über die Oberfläche lesbar (YAML) und wurden nicht geprüft.</p>` : ""}
      ${has("z2m") ? `<label class="sub" style="display:block;margin-top:12px" title="Zigbee2MQTT „Entfernen erzwingen“: das Gerät wird ohne Bestätigung aus Z2M gelöscht. Vor dem erneuten Anlernen zurücksetzen."><input type="checkbox" id="dForce" ${S.deleteForce ? "checked" : ""}> Antwortet ein Gerät nicht (z. B. schlafender Batterie-Sensor), trotzdem aus Zigbee2MQTT entfernen</label>` : ""}
      <p class="sub" style="margin:12px 0 0">Vorher wird der Stand des Add-ons gesichert. Ein gelöschtes Gerät muss neu angelernt werden, um es wieder zu nutzen.</p>
      <p style="margin:14px 0 6px">Zum Bestätigen <b>LÖSCHEN</b> eintippen:</p>
      <input id="dWord" autocomplete="off" spellcheck="false" style="width:100%">
      <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="no">Abbrechen</button><button class="btn danger" id="yes" disabled>Endgültig löschen</button></div>`;
    document.body.appendChild(dlg); dlg.showModal();
    const word = $("#dWord", dlg), yes = $("#yes", dlg), typed = () => ["löschen", "loeschen"].includes(word.value.trim().toLowerCase());
    const end = v => { dlg.close(); dlg.remove(); resolve(v); };
    word.focus();
    word.oninput = () => { yes.disabled = !typed(); };
    word.onkeydown = e => { if (e.key === "Enter") { e.preventDefault(); if (typed()) yes.click(); } };
    $("#no", dlg).onclick = () => end(false);
    yes.onclick = () => { if (!typed()) return; const f = $("#dForce", dlg); if (f) { S.deleteForce = f.checked; persist(); } end(true); };
    dlg.oncancel = () => end(false);
  });
}

/** Löscht Geräte restlos (Zigbee2MQTT/ZHA/Matter und Home Assistant); geplante Geräte verschwinden nur aus der Liste. */
async function deleteDevices(devs) {
  const real = devs.filter(d => !d.planned), planned = devs.filter(d => d.planned);
  let plan = {devices: [], usages: [], unreadable: 0};
  try { if (real.length) plan = await api.planDelete(real); } catch (e) { toast("Vorschau fehlgeschlagen: " + e.message); return; }
  if (!await confirmDelete(real, planned, plan)) return;
  const blocked = new Set(plan.devices.filter(x => x.blocked).map(x => x.device_id)), list = real.filter(d => !blocked.has(d.id));
  S.planned = S.planned.filter(p => !planned.some(d => d.id === p.id));
  let res = null;
  if (list.length) {
    try { res = await runWithProgress("Löschen läuft …", pid => api.deleteDevices(list, pid)); }
    catch (e) { toast("Löschen fehlgeschlagen: " + e.message); }
  }
  const gone = new Set([...(res?.deleted || []), ...planned.map(d => d.id)]);
  for (const id of gone) { delete S.meta[id]; S.sel.delete(id); }
  S.devices = S.devices.filter(d => !gone.has(d.id));
  persist();
  if (res) {
    await refreshFromHA(true); // maßgeblich ist, was Home Assistant wirklich hat
    await showChecks(res.checks || [], {recheck: () => api.verifyDelete(list, res.forced || [])}, res.errors || []);
  } else if (planned.length) toast(planned.length + " geplante(s) Gerät(e) entfernt");
  renderDevices();
}

/** items: [[device, neuerName], …]. Gibt die Anzahl umbenannter Geräte zurück. */
async function applyBatch(items) {
  const real = items.filter(([d]) => !d.planned);
  for (const [d, name] of items.filter(([d]) => d.planned)) S.planned.find(p => p.id === d.id).name = name;
  if (real.length) {
    try {
      if (S.renameEntities || S.setArea) {
        const plan = await api.plan(real);
        if ((S.renameEntities || plan.areas?.length) && !await confirmPlan(plan, real.length)) return 0;
      }
      const res = await runWithProgress("Umbenennen läuft …", pid => api.apply(real, pid));
      adoptAreas(res.items);
      const failed = new Set((res.errors || []).map(e => e.device_id).filter(Boolean));
      for (const [d, name] of real) { if (failed.has(d.id)) continue; const dev = S.devices.find(x => x.id === d.id); dev.name = name; dev.is_new = false; }
      await refreshFromHA(true); // maßgeblich ist, was Home Assistant wirklich hat
      if (res.errors?.length) toast("Fehler: " + res.errors.map(e => e.device + ": " + e.error).join("; "));
      await showChecks(res.checks || [], {items: res.items || api.payload(real), renamed: res.renamed_entities || [], opts: api.opts()}, res.errors || []);
    } catch (e) { toast("Fehler: " + e.message); return 0; }
  }
  persist(); return items.length;
}

/** „Verweise prüfen“: Automationen, Skripte, Szenen und Dashboards, die Entitäten nennen, die es nicht (mehr) gibt –
 *  je alte ID die heute gemeinte Entität wählen (Vorschlag aus dem Verlauf der Umbenennungen) und ersetzen. */
async function checkReferences() {
  const kinds = {automation: "Automation", script: "Skript", scene: "Szene", dashboard: "Dashboard"};
  const dlg = document.createElement("dialog");
  dlg.style.cssText = "max-width:720px;width:94%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
  const close = () => { dlg.close(); dlg.remove(); };
  const draw = (r, note = "") => {
    if (!r) { dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">🔍 Verweise prüfen</h2><p class="sub"><span class="spin"></span> Durchsuche Automationen, Skripte, Szenen und Dashboards …</p>`; return; }
    const where = id => r.items.filter(i => i.entities.includes(id)).map(i => `${kinds[i.kind] || i.kind} „${esc(i.title)}“`).join(", ");
    const choices = id => r.choices[id.split(".")[0]] || [], label = c => c ? (c.name ? c.name + " · " + c.id : c.id) : "";
    const chosen = Object.fromEntries(r.missing.filter(id => r.suggestions[id]).map(id => [id, r.suggestions[id]]));
    const scenesOf = id => r.items.filter(i => i.kind === "scene" && i.entities.includes(id));
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">${r.missing.length ? `⚠ ${r.missing.length} fehlende Entität(en) in ${r.items.length} Automation(en)/Dashboard(s)` : "✅ Keine Verweise auf fehlende Entitäten"}</h2>
      ${note}
      <p class="sub">${r.scanned} Automationen, Skripte, Szenen und Dashboards durchsucht (über die Oberfläche gepflegte)${r.unreadable ? `; ${r.unreadable} sind YAML und wurden nicht geprüft` : ""}.</p>
      ${r.missing.length ? `<p class="sub">Eine Karte wie die Hue-Like-Light-Card zeigt schon bei <b>einer</b> fehlenden Entität nur noch einen Fehler. Wähle je alte ID die Entität, die jetzt gemeint ist. Ersetzt wird nur die ID – Karten, Szenen und Automationen bleiben sonst unverändert und werden vorher gesichert.</p>
      <div style="max-height:50vh;overflow:auto">${r.missing.map(id => `<div style="padding:8px 0;border-bottom:1px solid var(--line)">
        <code>${esc(id)}</code> <span class="sub">in ${where(id)}</span>
        <div class="row" style="margin:6px 0 0;align-items:flex-start"><span style="padding-top:7px">→</span><div class="pick" data-old="${esc(id)}">
          <input type="search" autocomplete="off" spellcheck="false" placeholder="Entität suchen, z. B. lsp02 oder wohnzimmer lampe" value="${esc(label(choices(id).find(c => c.id === chosen[id])))}">
          <div class="pickres" hidden></div></div>${r.suggestions[id] ? `<span class="sub" style="padding-top:7px">aus dem Verlauf</span>` : ""}</div>
        ${scenesOf(id).length ? `<label class="sub" style="display:block;margin:6px 0 0 18px"><input type="checkbox" class="dropScene" data-old="${esc(id)}"> gibt es nicht mehr – aus ${scenesOf(id).length === 1 ? "der Szene" : scenesOf(id).length + " Szenen"} entfernen</label>` : ""}</div>`).join("")}</div>` : ""}
      ${r.missing.some(id => scenesOf(id).length) ? `<p class="sub" style="margin:10px 0 0">Findest du keinen Ersatz, gibt es die Entität meist nicht mehr (z. B. „do not disturb“ einer Lampe, die jetzt über Matter läuft). Aus Szenen lässt sie sich dann entfernen – nur dieser Eintrag, der Rest der Szene bleibt. <button class="btn" id="dropAll">Alle ohne Ersatz in Szenen markieren</button></p>` : ""}
      <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="again">Erneut prüfen</button>${r.missing.length ? `<button class="btn primary" id="go">Ausführen</button>` : ""}<button class="btn" id="close">Schließen</button></div>`;
    $("#close", dlg).onclick = close;
    $("#again", dlg).onclick = () => load();
    // Suchfeld je alter ID: alle Wörter müssen in Name oder Entity-ID vorkommen (Groß/klein, -, _, Umlaute egal)
    const norm = t => (t || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]+/g, " ");
    dlg.querySelectorAll(".pick").forEach(pk => {
      const old = pk.dataset.old, inp = $("input", pk), res = $(".pickres", pk), list = choices(old);
      const pickable = list.map(c => ({c, hay: norm(c.name + " " + c.id)})).sort((a, b) => label(a.c).localeCompare(label(b.c), "de", {numeric: true}));
      const show = () => {
        const cur = list.find(c => c.id === chosen[old]), q = inp.value === label(cur) ? "" : inp.value, words = norm(q).split(" ").filter(Boolean);
        const hits = pickable.filter(x => words.every(w => x.hay.includes(w)));
        res.innerHTML = hits.slice(0, 40).map(x => `<button type="button" data-id="${esc(x.c.id)}" class="${x.c.id === chosen[old] ? "on" : ""}">${esc(x.c.name || x.c.id)}<span class="sub" style="padding:0">${esc(x.c.id)}</span></button>`).join("")
          + (hits.length > 40 ? `<span class="sub">… und ${hits.length - 40} weitere – genauer suchen</span>` : hits.length ? "" : `<span class="sub">Keine Entität gefunden${scenesOf(old).length ? " – gibt es sie nicht mehr, unten „aus der Szene entfernen“ anhaken" : ""}</span>`);
        res.hidden = false;
      };
      inp.onfocus = () => { inp.select(); show(); };
      inp.oninput = () => { if (!inp.value.trim()) delete chosen[old]; show(); };
      inp.onkeydown = e => { if (e.key === "Escape") { e.stopPropagation(); e.preventDefault(); res.hidden = true; } if (e.key === "Enter") { e.preventDefault(); $("button", res)?.click(); } };
      inp.onblur = () => setTimeout(() => { res.hidden = true; inp.value = label(list.find(c => c.id === chosen[old])); }, 150);
      res.onpointerdown = e => e.preventDefault(); // Fokus bleibt im Suchfeld, bis gewählt ist
      res.onclick = e => { const b = e.target.closest("button[data-id]"); if (!b) return; chosen[old] = b.dataset.id; inp.value = label(list.find(c => c.id === b.dataset.id)); res.hidden = true; inp.blur();
        const drop = dlg.querySelector(`.dropScene[data-old="${CSS.escape(old)}"]`); if (drop) drop.checked = false; };
    });
    dlg.querySelectorAll(".dropScene").forEach(x => x.onchange = () => { if (x.checked) { delete chosen[x.dataset.old]; const inp = dlg.querySelector(`.pick[data-old="${CSS.escape(x.dataset.old)}"] input`); if (inp) inp.value = ""; } });
    $("#dropAll", dlg) && ($("#dropAll", dlg).onclick = () => dlg.querySelectorAll(".dropScene").forEach(x => { if (!chosen[x.dataset.old]) x.checked = true; }));
    $("#go", dlg) && ($("#go", dlg).onclick = async () => {
      const mapping = Object.fromEntries(Object.entries(chosen).filter(([, v]) => v));
      const drop = [...dlg.querySelectorAll(".dropScene:checked")].map(x => x.dataset.old).filter(id => !mapping[id]);
      if (!Object.keys(mapping).length && !drop.length) { toast("Keine Entität gewählt und nichts zum Entfernen angehakt"); return; }
      $("#go", dlg).disabled = true; $("#go", dlg).textContent = "Läuft …";
      try {
        let res = null, msg = "";
        if (Object.keys(mapping).length) {
          res = await api.repairRefs(mapping);
          msg += `<p>✅ ${res.updated_references.length} Automation(en)/Dashboard(s) angepasst${res.updated_references.length ? ": " + res.updated_references.map(u => esc(u.title)).join(", ") : ""}.</p>`
            + (res.errors || []).map(e => `<p>❌ <b>${esc(e.device)}</b> <span class="sub">${esc(e.error)}</span></p>`).join("");
        }
        if (drop.length) {
          res = await api.removeFromScenes(drop);
          msg += `<p>✅ Aus ${res.updated_references.length} Szene(n) entfernt${res.updated_references.length ? ": " + res.updated_references.map(u => esc(u.title)).join(", ") : ""}.</p>`
            + (res.errors || []).map(e => `<p>❌ <b>${esc(e.device)}</b> <span class="sub">${esc(e.error)}</span></p>`).join("");
        }
        draw(res, msg);
      } catch (e) { toast("Fehlgeschlagen: " + e.message); draw(r, note); }
    });
  };
  const load = async () => { draw(null); try { draw(await api.checkRefs()); } catch (e) { close(); toast("Prüfen fehlgeschlagen: " + e.message); } };
  document.body.appendChild(dlg); dlg.showModal(); dlg.oncancel = close;
  await load();
}

/** „💡 Neu zuordnen“ für vertauscht eingebaute Geräte (z. B. Spots): Die ausgewählten Geräte blinken nacheinander, je Gerät
 *  wählt man den Namen des Platzes, an dem es blinkt. Wählt man einen Namen, den ein anderes Gerät hat, tauschen die beiden –
 *  so bleibt es immer eine gültige Zuordnung (Tausch oder Ringtausch). Danach Vorschau und Ausführung über den Server.
 *  Automationen, Szenen und Dashboards bleiben beim Namen und steuern danach das Gerät, das am richtigen Platz so heißt. */
async function reassignWizard(sel) {
  const devs = sel.filter(d => !d.planned && !d.is_new);
  if (devs.length < 2) { toast("Mindestens 2 benannte Geräte auswählen"); return; }
  const byNameNat = (a, b) => a.localeCompare(b, "de", {numeric: true});
  const names = devs.map(d => d.name).sort(byNameNat), assign = new Map(devs.map(d => [d.id, d.name]));
  const ownerOf = name => devs.find(d => d.name === name); // wer den Namen bisher trägt
  const dlg = document.createElement("dialog");
  dlg.style.cssText = "max-width:640px;width:94%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
  const close = () => { dlg.close(); dlg.remove(); };
  document.body.appendChild(dlg); dlg.showModal(); dlg.oncancel = close;
  let i = 0, note = "";
  const blink = async () => {
    const st = $("#blinkSt", dlg); if (st) st.textContent = "💡 lasse blinken …";
    try { const r = await api.identify(devs[i]); if ($("#blinkSt", dlg)) $("#blinkSt", dlg).textContent = `💡 blinkt jetzt (${r.how})`; }
    catch (e) { if ($("#blinkSt", dlg)) $("#blinkSt", dlg).textContent = "⚠ Blinken nicht möglich: " + e.message; }
  };
  const step = () => {
    const d = devs[i], cur = assign.get(d.id);
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">💡 Neu zuordnen – Gerät ${i + 1} von ${devs.length}</h2>
      <p class="sub">Schau, welcher Spot blinkt, und wähle den Namen, der zu diesem Platz gehört. Wählst du einen Namen, den ein anderes Gerät hat, tauschen die beiden.</p>
      <p style="margin:10px 0 4px"><b id="blinkSt">💡 …</b></p>
      <p class="sub" style="margin:0 0 10px">heißt bisher: <b>${esc(d.name)}</b> · ${esc(d.manufacturer)} ${esc(d.model)}${d.area ? " · HA-Bereich: " + esc(d.area) : ""}</p>
      <div class="row"><label for="pickName" style="min-width:0">Das ist:</label><select id="pickName" style="flex:1">${names.map(n => {
        const holder = devs.find(e => e !== d && assign.get(e.id) === n);
        return `<option value="${esc(n)}"${n === cur ? " selected" : ""}>${esc(n)}${holder ? ` – tauscht mit dem Gerät, das bisher ${esc(holder.name)} heißt` : ""}</option>`; }).join("")}</select></div>
      ${note ? `<p class="sub" style="margin:6px 0 0">${note}</p>` : ""}
      <div class="row" style="justify-content:space-between;margin:16px 0 0">
        <button class="btn" id="again">💡 Nochmal blinken</button>
        <span><button class="btn" id="cancel">Abbrechen</button> ${i ? `<button class="btn" id="back">← Zurück</button>` : ""} ${i < devs.length - 1 ? `<button class="btn" id="toPlan">Zur Vorschau</button> <button class="btn primary" id="next">Weiter →</button>` : `<button class="btn primary" id="toPlan">Vorschau →</button>`}</span></div>`;
    $("#pickName", dlg).onchange = e => {
      const want = e.target.value, prev = assign.get(d.id), other = devs.find(x => x !== d && assign.get(x.id) === want);
      if (other) assign.set(other.id, prev);
      assign.set(d.id, want);
      note = other ? `Getauscht: Das Gerät, das bisher ${esc(other.name)} heißt, bekommt jetzt ${esc(prev)}.` : "";
      const keep = $("#blinkSt", dlg).textContent; step(); $("#blinkSt", dlg).textContent = keep;
    };
    $("#again", dlg).onclick = blink;
    $("#cancel", dlg).onclick = close;
    $("#back", dlg) && ($("#back", dlg).onclick = () => { i--; note = ""; step(); blink(); });
    $("#next", dlg) && ($("#next", dlg).onclick = () => { i++; note = ""; step(); blink(); });
    $("#toPlan", dlg).onclick = preview;
  };
  const items = () => devs.filter(d => assign.get(d.id) !== d.name).map(d => {
    const prev = ownerOf(assign.get(d.id)), area = S.setArea && prev?.area_id && prev.area_id !== d.area_id; // der Bereich folgt dem Namen
    return {device_id: d.id, name: assign.get(d.id), old_name: d.name, orig_name: d.orig_name, source: d.source, ieee: d.ieee, base_topic: gwOf(d).topic || "",
      ...(area ? {area_id: prev.area_id, area_name: prev.area, current_area_id: d.area_id || "", current_area: d.area || ""} : {})};
  });
  const preview = async () => {
    const list = items();
    if (!list.length) { dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">Keine Änderung</h2><p class="sub">Alle Geräte behalten ihren Namen.</p><div class="row" style="justify-content:flex-end"><button class="btn" id="back">← Zurück</button><button class="btn primary" id="ok">Schließen</button></div>`;
      $("#back", dlg).onclick = step; $("#ok", dlg).onclick = close; return; }
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">💡 Neu zuordnen – Vorschau</h2><p class="sub"><span class="spin"></span> Lese Entitäten …</p>`;
    let plan;
    try { plan = await api.reassignPlan(list); } catch (e) { toast("Vorschau fehlgeschlagen: " + e.message); step(); return; }
    dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">💡 ${list.length} Gerät(e) neu zuordnen</h2>
      <div class="preview" style="max-height:150px;overflow:auto">${list.map(it => `${esc(it.old_name)} → <b>${esc(it.name)}</b>`).join("<br>")}</div>
      <p class="sub" style="margin-top:12px">Entity-IDs wechseln mit dem Namen (${plan.entities.length}):</p>
      <div class="preview" style="max-height:150px;overflow:auto">${plan.entities.map(e => `${esc(e.old)} → <b>${esc(e.new)}</b>`).join("<br>") || "keine"}</div>
      ${plan.skipped.length ? `<p class="sub">⚠ Übersprungen (ID gehört einem anderen Gerät): ${plan.skipped.map(x => esc(x.old)).join(", ")}</p>` : ""}
      ${plan.areas.length ? `<p class="sub" style="margin-top:12px">Bereich in Home Assistant (folgt dem Namen):</p><div class="preview">${plan.areas.map(a => `${esc(a.device)}: ${esc(a.from || "–")} → <b>${esc(a.to)}</b>`).join("<br>")}</div>` : ""}
      <div class="banner" style="border-left-color:var(--ok);margin:12px 0 0;color:var(--fg)"><b>Automationen, Szenen und Dashboards bleiben unverändert.</b> Sie nennen die Namen bzw. IDs – und die gehören danach dem Gerät, das wirklich an diesem Platz hängt.</div>
      <p class="sub">${S.renameZ2m ? "Zigbee2MQTT-Geräte werden auch in Zigbee2MQTT umbenannt. " : ""}Vorher wird gesichert. Erst bekommen alle Geräte einen Zwischennamen, dann ihren neuen – so kollidiert nichts; geht der erste Schritt schief, wird er zurückgenommen.</p>
      <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="back">← Zurück</button><button class="btn" id="cancel">Abbrechen</button><button class="btn primary" id="go">Tauschen</button></div>`;
    $("#back", dlg).onclick = () => { step(); blink(); };
    $("#cancel", dlg).onclick = close;
    $("#go", dlg).onclick = async () => {
      close();
      // vor jeder Änderung festhalten, wer den neuen Namen bisher trägt – Haus/Etage/Raum/Typ wandern mit dem Namen
      const oldMeta = clone(S.meta), prevOf = new Map(list.map(it => [it.device_id, ownerOf(it.name)?.id]));
      let res;
      try { res = await runWithProgress("Geräte werden neu zugeordnet …", pid => api.reassign(list, pid)); }
      catch (e) { toast("Neu zuordnen fehlgeschlagen: " + e.message); return; }
      for (const it of list) if ((res.done || []).includes(it.device_id)) {
        S.meta[it.device_id] = clone(oldMeta[prevOf.get(it.device_id)] || {});
        const dev = S.devices.find(x => x.id === it.device_id); if (dev) dev.name = it.name;
      }
      S.sel.clear(); persist();
      await refreshFromHA(true); // maßgeblich ist, was Home Assistant wirklich hat
      await showChecks(res.checks || [], {items: list, renamed: [], opts: {rename_z2m: S.renameZ2m, set_area: S.setArea}}, res.errors || []);
      renderDevices();
    };
  };
  step(); blink();
}

/** „Doppelte Entitäten“: Die richtige ID ist schon vergeben, daneben hängt eine zweite Entität mit der alten ID (meist eine Altlast
 *  vom früheren Namen). Zeigt beide mit Zustand und Verwendung; verwaiste oder deaktivierte werden entfernt, Verweise auf die alte ID
 *  zeigen danach auf die neue. Aktive Entitäten entfernt das Add-on nie. */
async function resolveDuplicates(devs) {
  const pairs = devs.flatMap(d => dupIds(d).map(c => ({...c, device: d})));
  if (!pairs.length) return;
  const kinds = {automation: "Automation", script: "Skript", scene: "Szene", dashboard: "Dashboard"};
  const badge = st => `<span class="badge ${st === "aktiv" ? "ok" : st === "verwaist" ? "new" : ""}" title="${esc({aktiv: "liefert Werte", verwaist: "wird von der Integration nicht mehr geliefert – HA hält nur den letzten Stand", deaktiviert: "in Home Assistant deaktiviert", "ohne Zustand": "kein Zustand in Home Assistant (z. B. Integration nicht geladen)"}[st] || "")}">${esc(st || "fehlt")}</span>`;
  const dlg = document.createElement("dialog");
  dlg.style.cssText = "max-width:760px;width:94%;border:1px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg);padding:20px";
  const close = () => { dlg.close(); dlg.remove(); };
  document.body.appendChild(dlg); dlg.showModal(); dlg.oncancel = close;
  dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">⚠ Doppelte Entitäten</h2><p class="sub"><span class="spin"></span> Lese den Zustand aus Home Assistant …</p>`;
  let info;
  try { info = await api.entityInfo([...new Set(pairs.flatMap(p => [p.old, p.new]))]); } catch (e) { close(); toast("Fehler: " + e.message); return; }
  const st = id => info.entities[id]?.status, used = id => info.usages.filter(u => u.entities.includes(id)).map(u => `${kinds[u.kind] || u.kind} „${esc(u.title)}“`).join(", ");
  const removable = s => s === "verwaist" || s === "deaktiviert";
  const actionOf = p => removable(st(p.old)) && st(p.new) ? "remove_old" : removable(st(p.new)) && st(p.old) === "aktiv" ? "replace_new" : "";
  const text = {remove_old: p => `Alte Entität <code>${esc(p.old)}</code> entfernen – Verweise auf sie zeigen danach auf <code>${esc(p.new)}</code>.`,
    replace_new: p => `Die verwaiste/deaktivierte <code>${esc(p.new)}</code> entfernen und die aktive <code>${esc(p.old)}</code> in <code>${esc(p.new)}</code> umbenennen.`};
  dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">⚠ ${pairs.length} doppelte Entität(en)</h2>
    <p class="sub">Die richtige Entity-ID ist schon vergeben – daneben hängt am Gerät eine zweite Entität mit der alten ID, meist eine Altlast vom früheren Namen. Deshalb kann „Entity-IDs angleichen“ hier nichts tun. Verwaiste oder deaktivierte Entitäten kann das Add-on entfernen; Automationen und Dashboards, die die alte ID nutzen, werden dabei auf die richtige umgestellt (vorher gesichert). Aktive Entitäten werden nie entfernt.</p>
    <div style="max-height:52vh;overflow:auto">${pairs.map((p, i) => { const a = actionOf(p); return `<div style="padding:10px 0;border-bottom:1px solid var(--line)">
      <div class="sub"><b>${esc(p.device.name)}</b></div>
      <div><code>${esc(p.old)}</code> ${badge(st(p.old))} <span class="sub">alte ID${used(p.old) ? " · verwendet in " + used(p.old) : ""}</span></div>
      <div><code>${esc(p.new)}</code> ${badge(st(p.new))} <span class="sub">richtige ID${used(p.new) ? " · verwendet in " + used(p.new) : ""}</span></div>
      ${a ? `<label class="sub" style="display:block;margin-top:6px"><input type="checkbox" data-i="${i}" checked> ${text[a](p)}</label>`
        : `<p class="sub" style="margin:6px 0 0">${st(p.old) === "aktiv" && st(p.new) === "aktiv" ? "Beide liefern noch Werte – das Gerät wird wohl doppelt gemeldet (z. B. von zwei Zigbee2MQTT-Instanzen). Bitte in Zigbee2MQTT bzw. Home Assistant prüfen;" : "Der Zustand lässt keine sichere Entscheidung zu;"} das Add-on ändert hier nichts. <a href="${esc(haDevicePath(p.device))}" target="_top" class="lnk ha" data-dev="${esc(p.device.id)}">⌂ Gerät in HA</a></p>`}
    </div>`; }).join("")}</div>
    ${info.unreadable ? `<p class="sub">${info.unreadable} Automationen/Szenen sind YAML und wurden nicht geprüft.</p>` : ""}
    <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn" id="no">Schließen</button><button class="btn primary" id="go">Ausführen</button></div>`;
  const sync = () => { const n = dlg.querySelectorAll("input[data-i]:checked").length; $("#go", dlg).disabled = !n; $("#go", dlg).textContent = n ? `Ausführen (${n})` : "Nichts ausgewählt"; };
  dlg.querySelectorAll("input[data-i]").forEach(x => x.onchange = sync); sync();
  dlg.querySelectorAll("a[data-dev]").forEach(x => x.onclick = e => { close(); haNavigate(e, x.getAttribute("href")); });
  $("#no", dlg).onclick = close;
  $("#go", dlg).onclick = async () => {
    const chosen = [...dlg.querySelectorAll("input[data-i]:checked")].map(x => pairs[+x.dataset.i]).map(p => ({old: p.old, new: p.new, action: actionOf(p)}));
    $("#go", dlg).disabled = true; $("#go", dlg).textContent = "Läuft …";
    try {
      const res = await api.dedupe(chosen);
      const gone = new Set(res.done.map(x => x.old));
      for (const d of devs) d.dup_ids = dupIds(d).filter(c => !gone.has(c.old));
      await refreshFromHA(true); // maßgeblich ist, was Home Assistant wirklich hat
      dlg.innerHTML = `<h2 style="margin:0 0 8px;font-size:16px">${res.errors.length ? "⚠️ Nicht alles hat geklappt" : "✅ Doppelte Entitäten aufgelöst"}</h2>
        <div class="preview" style="line-height:1.6">${res.done.map(x => `✅ ${esc(x.old)} → <b>${esc(x.new)}</b>`).join("<br>") || "Nichts geändert."}
        ${res.updated_references.length ? `<br>✅ Verweise angepasst in: ${res.updated_references.map(u => esc(u.title)).join(", ")}` : ""}
        ${res.errors.map(e => `<br>❌ <b>${esc(e.device)}</b> <span class="sub">${esc(e.error)}</span>`).join("")}</div>
        <div class="row" style="justify-content:flex-end;margin:16px 0 0"><button class="btn primary" id="ok">Schließen</button></div>`;
      $("#ok", dlg).onclick = close;
    } catch (e) { toast("Fehler: " + e.message); close(); }
    renderDevices();
  };
}

/** Benennt die Entity-IDs benannter Geräte nach ihrem Namen um (z. B. light.wohnzimmer_s2_wzel03 → light.s2_wzel_lsp03) –
 *  Gerätename und Bereich bleiben. Verweise in Automationen/Dashboards/YAML/Node-RED nach den Haken in der Liste. */
async function fixEntityIds(devs) {
  const list = devs.filter(d => staleIds(d).length).map(d => [d, d.name]);
  if (!list.length) return;
  const extra = {entities_only: true, rename_entities: true, rename_z2m: false, set_area: false, skip_names: true};
  try {
    const plan = await api.plan(list, extra);
    if (!await confirmPlan(plan, list.length, "ids")) return;
    extra.update_references = S.updateRefs; // „mit anpassen“ im Dialog setzt den Haken
    const res = await runWithProgress("Entity-IDs werden angeglichen …", pid => api.apply(list, pid, extra));
    const failed = new Set((res.errors || []).map(e => e.device_id).filter(Boolean));
    for (const [d] of list) if (!failed.has(d.id)) d.stale_ids = [];
    await refreshFromHA(true); // maßgeblich ist, was Home Assistant wirklich hat
    if (res.errors?.length) toast("Fehler: " + res.errors.map(e => e.device + ": " + e.error).join("; "));
    await showChecks(res.checks || [], {items: res.items || api.payload(list), renamed: res.renamed_entities || [], opts: {...api.opts(), ...extra}}, res.errors || []);
  } catch (e) { toast("Fehler: " + e.message); }
  renderDevices();
}

async function pollPermit() { if (!$("#tab-gateways").hidden) { try { S.permitReal = await api.permitState(); tickPermit(); } catch (e) {} } }
